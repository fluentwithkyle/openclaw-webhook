name: One-Click Full Test Suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-click-full-test-suite.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'poc/**'
      - 'routes/**'
      - 'test/**'
      - 'index.js'
      - 'lib/**'

permissions:
  contents: read

jobs:
  full-test-suite:
    name: Full npm test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run ACP artifact test suite
        run: node test/acp-task-artifact.test.js

      - name: Run every test file and collect all failures
        shell: bash
        run: |
          set +e
          failed=0
          for test_file in test/*.test.js; do
            echo "===== RUNNING: $test_file ====="
            node "$test_file"
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::Test file failed: $test_file (exit $status)"
              failed=1
            fi
          done
          exit "$failed"
