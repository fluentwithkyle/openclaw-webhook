name: One-Click Full Test Suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-click-full-test-suite.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'poc/**'
      - 'routes/**'
      - 'test/**'
      - 'index.js'
      - 'lib/**'

permissions:
  contents: read

jobs:
  full-test-suite:
    name: Full npm test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run ACP artifact test suite
        run: node test/acp-task-artifact.test.js

      - name: Run full test suite
        run: npm test
