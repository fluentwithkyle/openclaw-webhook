name: One-Click Gemini Activation Verify Reconcile

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  dispatch-gemini-verify-reconcile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Construct Gemini verification task
        id: task
        shell: bash
        run: |
          set -euo pipefail

          REQUEST_ID="TASK-KILO-GEMINI-RESEARCH-ONE-CLICK-ACTIVATION-VERIFY-RECONCILE-001"
          TASK_FILE="gemini-verify-reconcile-task.md"

          cat > "$TASK_FILE" <<'TASK_EOF'
          {"task_name":"TASK-KILO-GEMINI-RESEARCH-ONE-CLICK-ACTIVATION-VERIFY-RECONCILE-001","originator":"Kyle — Director","target_agent":"Gemini","repository":"fluentwithkyle/openclaw-webhook","base_branch":"main","task_mode":"VERIFY_RECONCILE","capabilities":["read_only","modify_files","commit","push"],"objective":"Independently verify the live end-to-end Gemini RESEARCH_DOCUMENT one-click activation path and reconcile the verified result into the canonical durable project records.","scope":{"permitted_paths":["docs/ai/TASK_LOG.md","docs/ai/STATE.md","docs/ai/CONTROL_CENTER.md"]},"verification":"1. Verify the actual one-click workflow dispatch and exact execution/request correlation. 2. Verify canonical external activation admission and server-derived authority. 3. Verify TaskRegistry lifecycle and execution claim correlation through Gemini execution and callback/evidence. 4. Retrieve and inspect canonical gemini-acp-report and gemini-acp-report.json artifacts; these are the sole authoritative Gemini result sources. 5. If either canonical artifact is unavailable or insufficient, report NOT VERIFIED/BLOCKED rather than substituting workflow conclusions, job summaries, annotations, comments, or prior reports. 6. Classify major findings as VERIFIED, INFERRED, or UNKNOWN. 7. Reconcile the verified outcome into TASK_LOG.md, STATE.md, and CONTROL_CENTER.md only where evidence warrants durable state change. 8. Validate the reconciliation and final diff. 9. Commit and push the reconciliation to main and report the commit SHA.","constraints":["Verification and reconciliation only; do not repair implementation defects.","Do not modify .github/workflows/*.","Do not modify poc/*, runtime source, activation policy, TaskRegistry, or execution-carrier implementation.","Do not create a second control plane, executor, state store, or activation path.","Canonical gemini-acp-report and gemini-acp-report.json artifacts are mandatory evidence for claiming Gemini execution success.","If evidence is insufficient, mark UNKNOWN or BLOCKED.","persistence_expectation: same_execution","deliverable_commit: true","deliverable_push: true","verification_requires_commit_sha: true"],"conflict_handling":"Repository instructions, GEMINI.md, docs/ai/CHATGPT_PROJECT_OPERATING_PROTOCOL.md, and docs/ai/TASK_STANDARD.md take precedence. Use repository evidence and reconcile discrepancies explicitly."}
          TASK_EOF

          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"
          echo "task_file=$TASK_FILE" >> "$GITHUB_OUTPUT"

      - name: Preflight - validate embedded ACP task artifact
        shell: bash
        run: |
          set -euo pipefail
          node poc/validate-external-activation.js one-click-preflight '{"workflow_dir": ".github/workflows"}'

      - name: Dispatch canonical Gemini verification carrier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          REPOSITORY="${{ github.repository }}"
          REQUEST_ID="${{ steps.task.outputs.request_id }}"
          TASK_FILE="${{ steps.task.outputs.task_file }}"

          jq -n             --arg ref "main"             --arg request_id "$REQUEST_ID"             --rawfile task "$TASK_FILE"             --arg repository "$REPOSITORY"             --arg base_branch "main"             --arg task_mode "VERIFY_RECONCILE"             --arg capabilities "read_only,modify_files,commit,push"             --arg permitted_paths "docs/ai/TASK_LOG.md,docs/ai/STATE.md,docs/ai/CONTROL_CENTER.md"             --arg verification "Independently verify live Gemini one-click activation using canonical gemini-acp-report artifacts; reconcile verified outcome into TASK_LOG.md, STATE.md, CONTROL_CENTER.md; distinguish VERIFIED/INFERRED/UNKNOWN; commit and push; report commit SHA"             '{
              ref: $ref,
              inputs: {
                request_id: $request_id,
                task: ($task | rtrimstr("\n")),
                repository: $repository,
                base_branch: $base_branch,
                task_mode: $task_mode,
                capabilities: $capabilities,
                permitted_paths: $permitted_paths,
                verification: $verification
              }
            }' > dispatch-payload.json

          gh api             --method POST             -H "Accept: application/vnd.github+json"             "/repos/${REPOSITORY}/actions/workflows/main.yml/dispatches"             --input dispatch-payload.json

          echo "::notice::Canonical Gemini VERIFY_RECONCILE carrier dispatched for ${REQUEST_ID}."
