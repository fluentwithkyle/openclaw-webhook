name: One-Click Gemini Builder Activation Status Research

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  dispatch-gemini-research:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Construct canonical ACP research carrier
        id: task
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="TASK-GEMINI-BUILDER-ONE-CLICK-ZERO-INPUT-ACTIVATION-STATUS-RESEARCH-001"
          TASK_FILE="gemini-builder-one-click-status-research.md"
          cat > "$TASK_FILE" <<'TASK_EOF'
@kyle

task_name: TASK-GEMINI-BUILDER-ONE-CLICK-ZERO-INPUT-ACTIVATION-STATUS-RESEARCH-001
originator: Kyle — Director
target_agent: Gemini
repository: fluentwithkyle/openclaw-webhook
base_branch: main
task_mode: RESEARCH_DOCUMENT
capabilities:
- read_only
- modify_files
- commit
- push
objective: >
  Research and document the current repository and GitHub state of activating
  Gemini Builder through a true one-click zero-input workflow. Determine what
  already works, what is missing or blocked, and the smallest next action
  required to make Builder activation operational. This is research only.
scope:
  - Inspect existing Gemini Builder one-click workflows and recent runs.
  - Inspect the one-click workflow contract and canonical activation architecture.
  - Inspect activation policy, ingress, ACP schema, TaskRegistry/execution descriptor,
    relevant tests, and durable research records.
  - Determine GitHub registration/runnability using authoritative evidence where available.
  - Produce the durable research record at docs/ai/research/research-TASK-GEMINI-BUILDER-ONE-CLICK-ZERO-INPUT-ACTIVATION-STATUS-RESEARCH-001.md.
verification:
  - Distinguish VERIFIED, INFERRED, and UNKNOWN.
  - Include mandatory ## Roadmap Alignment with exact required fields.
  - Update RESEARCH_INDEX.md and TASK_LOG.md as required.
  - State the exact blockers and smallest next authorized action.
  - State READY, PARTIALLY READY, or BLOCKED.
  - Explicitly state no implementation was performed.
  - Commit and push the research/documentation result and report the commit SHA.
constraints:
  - Research/documentation only.
  - Do not modify .github/workflows/*.
  - Do not modify runtime source or activation implementation.
  - Do not reconstruct or redesign the existing one-click architecture.
  - Do not claim GitHub registration/runnability without authoritative GitHub evidence.
  - If authoritative GitHub evidence is unavailable, classify it UNKNOWN and fail closed.
  - persistence_expectation: same_execution
  - deliverable_commit: true
  - deliverable_push: true
  - verification_requires_commit_sha: true
conflict_handling: >
  Repository instructions, GEMINI.md, ARCHITECTURE.md,
  docs/ai/CHATGPT_PROJECT_OPERATING_PROTOCOL.md, docs/ai/TASK_STANDARD.md,
  and canonical activation implementation take precedence.
TASK_EOF
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"
          echo "task_file=$TASK_FILE" >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical Gemini RESEARCH_DOCUMENT carrier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPOSITORY="${{ github.repository }}"
          REQUEST_ID="${{ steps.task.outputs.request_id }}"
          TASK_FILE="${{ steps.task.outputs.task_file }}"
          jq -n             --arg ref "main"             --arg request_id "$REQUEST_ID"             --rawfile task "$TASK_FILE"             --arg repository "$REPOSITORY"             --arg base_branch "main"             --arg task_mode "RESEARCH_DOCUMENT"             --arg capabilities "read_only,modify_files,commit,push"             --arg permitted_paths "docs/ai/research/,docs/ai/RESEARCH_INDEX.md,docs/ai/TASK_LOG.md"             --arg verification "Create durable research record; inspect Gemini Builder one-click activation; distinguish VERIFIED/INFERRED/UNKNOWN; identify blockers and smallest next action; commit and push."             '{ref:$ref,inputs:{request_id:$request_id,task:($task|rtrimstr("\n")),repository:$repository,base_branch:$base_branch,task_mode:$task_mode,capabilities:$capabilities,permitted_paths:$permitted_paths,verification:$verification}}' > dispatch-payload.json
          gh api --method POST -H "Accept: application/vnd.github+json" "/repos/$REPOSITORY/actions/workflows/main.yml/dispatches" --input dispatch-payload.json
