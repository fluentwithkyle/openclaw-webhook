name: Gemini Architect and Reviewer

# This comment exists solely to force GitHub workflow re-registration (TASK-KILO-GITHUB-WORKFLOW-TRIGGER-REREGISTRATION-001)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Correlation request ID for Kilo->Gemini orchestration'
        required: true
        type: string
      task:
        description: 'Task description for Gemini execution'
        required: true
        type: string
      repository:
        description: 'Repository name (owner/repo)'
        required: true
        type: string
      base_branch:
        description: 'Base branch for the task'
        required: true
        type: string
      kilo_execution_id:
        description: 'Optional Kilo execution identifier from completed Kilo run (if Builder was triggered after Kilo completion)'
        required: false
        type: string
      builder_execution_id:
        description: 'Optional Builder execution identifier (for correlation with Gemini Builder workflow)'
        required: false
        type: string
      verification:
        description: 'Original ACP task verification requirements for Gemini review'
        required: false
        type: string
      approval_id:
        description: 'Director approval identifier for consequential FAILOVER_EXECUTE activation'
        required: false
        type: string
      task_mode:
        description: 'Operating mode: REVIEW (read-only), VERIFY_RECONCILE (bounded commit/push), RESEARCH_DOCUMENT (research + documentation persistence), or FAILOVER_EXECUTE (full execution)'
        required: false
        type: string
        default: 'REVIEW'
      capabilities:
        description: 'Comma-separated authorized capabilities (e.g. read_only,modify_files,commit,push)'
        required: false
        type: string
        default: 'read_only'
      permitted_paths:
        description: 'Comma-separated authorized file paths for verification/reconciliation'
        required: false
        type: string

jobs:
  advisory:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '@gemini-cli') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Gemini request (issue_comment)
        id: request_comment
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          REQUEST="${COMMENT_BODY#@gemini-cli}"
          REQUEST="${REQUEST# }"

          # Detect explicit FAILOVER_EXECUTE activation: "@gemini-cli FAILOVER_EXECUTE <task>"
          # Default to REVIEW for plain @gemini-cli comments.
          TASK_MODE="REVIEW"
          CAPABILITIES="read_only"
          PERMITTED_PATHS="poc/"

          if echo "$REQUEST" | grep -qiE '^FAILOVER_EXECUTE\b'; then
            TASK_MODE="FAILOVER_EXECUTE"
            CAPABILITIES="read_only,modify_files,run_tests,commit,push"
            # Strip the "FAILOVER_EXECUTE" keyword, leaving the task description
            REQUEST="${REQUEST#FAILOVER_EXECUTE}"
            REQUEST="${REQUEST# }"
          fi

          {
            echo 'request<<EOF'
            printf '%s\n' "$REQUEST"
            echo 'EOF'
            echo "task_mode=$TASK_MODE"
            echo "capabilities=$CAPABILITIES"
            echo "permitted_paths=$PERMITTED_PATHS"
          } >> "$GITHUB_OUTPUT"

      - name: Issue Director approval for consequential Gemini activation (issue_comment)
        id: director_approval_ic
        if: github.event_name == 'issue_comment' && steps.request_comment.outputs.task_mode == 'FAILOVER_EXECUTE'
        env:
          CALLBACK_BASE_URL: ${{ secrets.RENDER_CALLBACK_BASE_URL }}
          DIRECTOR_APPROVAL_SECRET: ${{ secrets.DIRECTOR_APPROVAL_SECRET }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
          CAPABILITIES: ${{ steps.request_comment.outputs.capabilities }}
          PERMITTED_PATHS: ${{ steps.request_comment.outputs.permitted_paths }}
          ACTOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$ACTOR_ASSOCIATION" != "OWNER" ]; then
            echo "::error::FAILOVER_EXECUTE activation requires repository-owner Director authorization"
            exit 1
          fi
          APPROVAL_JSON=$(jq -n \
            --arg request_id "$COMMENT_ID" \
            --arg target "Gemini" \
            --arg task_mode "FAILOVER_EXECUTE" \
            --arg repository "$REPOSITORY" \
            --arg base_branch "$BASE_BRANCH" \
            --arg capabilities "$CAPABILITIES" \
            --arg permitted_paths "$PERMITTED_PATHS" \
            '{scope:{request_id:$request_id,target:$target,task_mode:$task_mode,capabilities:($capabilities|split(",")),permitted_paths:($permitted_paths|split(",")),repository:$repository,base_branch:$base_branch}}')
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -X POST "$CALLBACK_BASE_URL/poc/director/approve" \
            -H "Content-Type: application/json" \
            -H "x-director-approval-secret: $DIRECTOR_APPROVAL_SECRET" \
            --data "$APPROVAL_JSON")
          APPROVAL_ID=$(printf '%s' "$RESPONSE" | jq -r '.approval_id // empty')
          if [ -z "$APPROVAL_ID" ]; then
            echo "::error::Director approval response did not contain approval_id"
            exit 1
          fi
          echo "approval_id=$APPROVAL_ID" >> "$GITHUB_OUTPUT"

      - name: Validate external activation through canonical ingress (issue_comment)
        id: validate_activation
        if: github.event_name == 'issue_comment'
        env:
          CALLBACK_BASE_URL: ${{ secrets.RENDER_CALLBACK_BASE_URL }}
          ACP_POC_TRIGGER_SECRET: ${{ secrets.ACP_POC_TRIGGER_SECRET }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
          APPROVAL_ID: ${{ steps.director_approval_ic.outputs.approval_id }}
          EXECUTION_DESCRIPTOR_FILE: execution-descriptor.json
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$CALLBACK_BASE_URL" ]; then
            echo "::error::RENDER_CALLBACK_BASE_URL is not configured; cannot validate activation through canonical ingress"
            exit 1
          fi

          # Build the activation payload with jq so multiline/control characters in
          # the GitHub comment are JSON-escaped before canonical validation.
          ACTIVATION_JSON=$(jq -n \
            --arg comment_id "$COMMENT_ID" \
            --arg comment_body "$COMMENT_BODY" \
            --arg repository "$REPOSITORY" \
            --arg base_branch "$BASE_BRANCH" \
            '{
              comment_id: $comment_id,
              comment_body: $comment_body,
              repository: $repository,
              base_branch: $base_branch,
              approval_id: $approval_id
            }')

          node poc/validate-external-activation.js gemini-issue-comment "$ACTIVATION_JSON"

          echo "activation_validated=true" >> "$GITHUB_OUTPUT"

      - name: Validate external activation through canonical ingress (workflow_dispatch)
        id: validate_activation_wfd
        if: github.event_name == 'workflow_dispatch'
        env:
          CALLBACK_BASE_URL: ${{ secrets.RENDER_CALLBACK_BASE_URL }}
          ACP_POC_TRIGGER_SECRET: ${{ secrets.ACP_POC_TRIGGER_SECRET }}
          REQUEST_ID: ${{ inputs.request_id }}
          TASK: ${{ inputs.task }}
          REPOSITORY: ${{ inputs.repository }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          TASK_MODE: ${{ inputs.task_mode || 'REVIEW' }}
          CAPABILITIES: ${{ inputs.capabilities || 'read_only' }}
          PERMITTED_PATHS: ${{ inputs.permitted_paths || 'poc/' }}
          APPROVAL_ID: ${{ inputs.approval_id || '' }}
          VERIFICATION: ${{ inputs.verification || '' }}
          EXECUTION_DESCRIPTOR_FILE: execution-descriptor.json
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$CALLBACK_BASE_URL" ]; then
            echo "::error::RENDER_CALLBACK_BASE_URL is not configured; cannot validate activation through canonical ingress"
            exit 1
          fi

          ACTIVATION_JSON=$(jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg task "$TASK" \
            --arg repository "$REPOSITORY" \
            --arg base_branch "$BASE_BRANCH" \
            --arg task_mode "$TASK_MODE" \
            --arg capabilities "$CAPABILITIES" \
            --arg permitted_paths "$PERMITTED_PATHS" \
            --arg approval_id "$APPROVAL_ID" \
            --arg verification "$VERIFICATION" \
            '{
              request_id: $request_id,
              task: $task,
              repository: $repository,
              base_branch: $base_branch,
              task_mode: $task_mode,
              capabilities: $capabilities,
              permitted_paths: $permitted_paths,
              approval_id: $approval_id,
              verification: $verification
            }')

          node poc/validate-external-activation.js gemini-workflow-dispatch "$ACTIVATION_JSON"

          echo "activation_validated=true" >> "$GITHUB_OUTPUT"

      - name: Prepare orchestration context (workflow_dispatch)
        id: orchestration_context_wfd
        if: github.event_name == 'workflow_dispatch' && steps.validate_activation_wfd.outputs.activation_validated == 'true' && !steps.validate_activation_wfd.outputs.replay
        shell: bash
        run: |
          set -euo pipefail

          # The orchestration context now consumes the SERVER-DERIVED execution descriptor
          # returned by the canonical activation ingress, not workflow input values.
          # The descriptor contains authoritative request_id, task_mode, capabilities,
          # permitted_paths, task, repository, and base_branch.
          DESCRIPTOR_FILE="execution-descriptor.json"
          if [ ! -f "$DESCRIPTOR_FILE" ]; then
            echo "::error::Execution descriptor file not found; server validation may have produced a replay"
            exit 1
          fi

          {
            echo 'request_id<<EOF'
            jq -r '.request_id' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'task<<EOF'
            jq -r '.task' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'repository<<EOF'
            jq -r '.repository' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'base_branch<<EOF'
            jq -r '.base_branch' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'kilo_execution_id<<EOF'
            printf '%s\n' ""
            echo 'EOF'
            echo 'builder_execution_id<<EOF'
            printf '%s\n' ""
            echo 'EOF'
            echo 'verification<<EOF'
            jq -r '.verification' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'task_mode<<EOF'
            jq -r '.task_mode' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'capabilities<<EOF'
            jq -r '.capabilities | join(",")' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'permitted_paths<<EOF'
            jq -r '.permitted_paths | join(",")' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'execution_claim_id<<EOF'
            jq -r '.execution_claim_id // ""' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'carrier_identity<<EOF'
            printf '%s\n' "${{ steps.validate_activation_wfd.outputs.carrier_identity }}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare orchestration context (issue_comment)
        id: orchestration_context_ic
        if: github.event_name == 'issue_comment' && steps.validate_activation.outputs.activation_validated == 'true' && !steps.validate_activation.outputs.replay
        shell: bash
        run: |
          set -euo pipefail

          # The orchestration context now consumes the SERVER-DERIVED execution descriptor
          # returned by the canonical activation ingress, not workflow input values.
          DESCRIPTOR_FILE="execution-descriptor.json"
          if [ ! -f "$DESCRIPTOR_FILE" ]; then
            echo "::error::Execution descriptor file not found; server validation may have produced a replay"
            exit 1
          fi

          {
            echo 'request_id<<EOF'
            jq -r '.request_id' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'task<<EOF'
            jq -r '.task' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'repository<<EOF'
            jq -r '.repository' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'base_branch<<EOF'
            jq -r '.base_branch' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'kilo_execution_id<<EOF'
            printf '%s\n' ""
            echo 'EOF'
            echo 'builder_execution_id<<EOF'
            printf '%s\n' ""
            echo 'EOF'
            echo 'verification<<EOF'
            jq -r '.verification' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'task_mode<<EOF'
            jq -r '.task_mode' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'capabilities<<EOF'
            jq -r '.capabilities | join(",")' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'permitted_paths<<EOF'
            jq -r '.permitted_paths | join(",")' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'execution_claim_id<<EOF'
            jq -r '.execution_claim_id // ""' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'carrier_identity<<EOF'
            printf '%s\n' "${{ steps.validate_activation.outputs.carrier_identity }}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Gemini in advisory mode
        id: gemini_run
        if: (steps.validate_activation.outputs.activation_validated == 'true' && !steps.validate_activation.outputs.replay) || (steps.validate_activation_wfd.outputs.activation_validated == 'true' && !steps.validate_activation_wfd.outputs.replay)
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          ORCHESTRATION_REQUEST_ID: ${{ steps.orchestration_context_wfd.outputs.request_id || steps.orchestration_context_ic.outputs.request_id }}
          ORCHESTRATION_TASK: ${{ steps.orchestration_context_wfd.outputs.task || steps.orchestration_context_ic.outputs.task }}
          ORCHESTRATION_REPOSITORY: ${{ steps.orchestration_context_wfd.outputs.repository || steps.orchestration_context_ic.outputs.repository }}
          ORCHESTRATION_BASE_BRANCH: ${{ steps.orchestration_context_wfd.outputs.base_branch || steps.orchestration_context_ic.outputs.base_branch }}
          ORCHESTRATION_KILO_EXECUTION_ID: ${{ steps.orchestration_context_wfd.outputs.kilo_execution_id || steps.orchestration_context_ic.outputs.kilo_execution_id }}
          ORCHESTRATION_BUILDER_EXECUTION_ID: ${{ steps.orchestration_context_wfd.outputs.builder_execution_id || steps.orchestration_context_ic.outputs.builder_execution_id }}
          ORCHESTRATION_VERIFICATION: ${{ steps.orchestration_context_wfd.outputs.verification || steps.orchestration_context_ic.outputs.verification }}
          ORCHESTRATION_TASK_MODE: ${{ steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode }}
          ORCHESTRATION_CAPABILITIES: ${{ steps.orchestration_context_wfd.outputs.capabilities || steps.orchestration_context_ic.outputs.capabilities }}
          ORCHESTRATION_PERMITTED_PATHS: ${{ steps.orchestration_context_wfd.outputs.permitted_paths || steps.orchestration_context_ic.outputs.permitted_paths }}
          ORCHESTRATION_EXECUTION_CLAIM_ID: ${{ steps.orchestration_context_wfd.outputs.execution_claim_id || steps.orchestration_context_ic.outputs.execution_claim_id }}
          ORCHESTRATION_CARRIER_IDENTITY: ${{ steps.orchestration_context_wfd.outputs.carrier_identity || steps.orchestration_context_ic.outputs.carrier_identity }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          github_issue_number: ${{ github.event.issue.number }}
          github_pr_number: ${{ github.event.pull_request.number }}
          prompt: |
            You are Gemini, the Fluent with Kyle OpenClaw project's
            Architect, Reviewer, and Research agent.

            OPERATING MODE: ${{ steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || 'REVIEW' }}

            ${{ (steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || 'REVIEW') == 'REVIEW' && 'MODE: REVIEW (READ-ONLY ADVISORY). You may inspect and analyze the repository but MUST NOT modify any files, commit, push, or otherwise change repository state. Your role is advisory: provide analysis, risk assessment, implementation plans, and acceptance criteria.' || ((steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || 'REVIEW') == 'VERIFY_RECONCILE' && format('MODE: VERIFY_RECONCILE (BOUNDED RECONCILIATION). You are authorized to inspect verification of Kilo execution, update ONLY the following documentation files: {0}, and commit + push changes to those specific files. You MUST NOT modify any source code, production code, or files outside the permitted_paths list. Authorized capabilities: {1}. You MUST validate all changes against the verification requirements before committing.', steps.orchestration_context_wfd.outputs.permitted_paths || steps.orchestration_context_ic.outputs.permitted_paths, steps.orchestration_context_wfd.outputs.capabilities || steps.orchestration_context_ic.outputs.capabilities) || ((steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || 'REVIEW') == 'RESEARCH_DOCUMENT' && format('MODE: RESEARCH_DOCUMENT (RESEARCH + DURABLE PERSISTENCE). Inspect the architecture and relevant files to analyze problems or gather information, and persist findings to the durable research/documentation surface. Authorized paths: {0}. Authorized capabilities: {1}. Research documentation is an intrinsic completion requirement: you MUST persist the research record, research index entry, and TASK_LOG reference (committed and pushed) before completion. You MUST NOT modify source code, production code, or files outside permitted_paths. run_tests is not an authorized RESEARCH_DOCUMENT capability.', steps.orchestration_context_wfd.outputs.permitted_paths || steps.orchestration_context_ic.outputs.permitted_paths, steps.orchestration_context_wfd.outputs.capabilities || steps.orchestration_context_ic.outputs.capabilities) || format('MODE: FAILOVER_EXECUTE (FULL EXECUTION). You are authorized to implement, test, commit, and push within the permitted_paths scope. Authorized capabilities: {0}. Use git tools (commit, push) as needed but stay within scope.', steps.orchestration_context_wfd.outputs.capabilities || steps.orchestration_context_ic.outputs.capabilities))) }}

            If operating in REVIEW mode, your response is advisory only — no repository mutations.
            If operating in VERIFY_RECONCILE mode, you may only touch files in permitted_paths (docs/ai/*), commit, and push.
            If operating in FAILOVER_EXECUTE mode, you may implement and push within permitted_paths.

            ORCHESTRATION CONTEXT:
            - request_id: ${{ steps.orchestration_context_wfd.outputs.request_id || steps.orchestration_context_ic.outputs.request_id || 'manual' }}
            - repository: ${{ steps.orchestration_context_wfd.outputs.repository || steps.orchestration_context_ic.outputs.repository || github.repository }}
            - base_branch: ${{ steps.orchestration_context_wfd.outputs.base_branch || steps.orchestration_context_ic.outputs.base_branch || github.ref_name }}
            - task: ${{ steps.orchestration_context_wfd.outputs.task || steps.orchestration_context_ic.outputs.task || steps.request_comment.outputs.request || 'Provide an architecture/status assessment of the current repository.' }}
            - kilo_execution_id: ${{ steps.orchestration_context_wfd.outputs.kilo_execution_id || steps.orchestration_context_ic.outputs.kilo_execution_id || '' }}
            - verification_requirements: ${{ steps.orchestration_context_wfd.outputs.verification || steps.orchestration_context_ic.outputs.verification || 'Not specified' }}
            - task_mode: ${{ steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || 'REVIEW' }}
            - capabilities: ${{ steps.orchestration_context_wfd.outputs.capabilities || steps.orchestration_context_ic.outputs.capabilities || 'read_only' }}
            - permitted_paths: ${{ steps.orchestration_context_wfd.outputs.permitted_paths || steps.orchestration_context_ic.outputs.permitted_paths || '(none)' }}

            ${{ steps.orchestration_context_wfd.outputs.request_id || steps.orchestration_context_ic.outputs.request_id != '' && 'This task was dispatched from the Kilo orchestration layer. The request_id correlates this Gemini execution with the originating Kilo completion.' || 'The request below was explicitly submitted by a trusted repository collaborator through the @gemini-cli interface. Treat that request as the actual task.' }}

            --- TASK START ---
            ${{ steps.orchestration_context_wfd.outputs.task || steps.orchestration_context_ic.outputs.task || steps.request_comment.outputs.request || 'Provide an architecture/status assessment of the current repository.' }}
            --- TASK END ---

            VERIFICATION REQUIREMENTS (from original ACP task):
            ${{ steps.orchestration_context_wfd.outputs.verification || steps.orchestration_context_ic.outputs.verification || 'No specific verification requirements provided. Evaluate based on standard architectural review criteria.' }}

            IMPORTANT: When reviewing Kilo's work, you MUST explicitly evaluate against the VERIFICATION REQUIREMENTS listed above. Your review must address each requirement and state whether it is satisfied, partially satisfied, or not satisfied. If verification requirements are not met, clearly identify what is missing.

            Read ARCHITECTURE.md and GEMINI.md before responding.
            Distinguish observations from recommendations.
            Return a concrete, actionable response for the project.

      - name: Determine Gemini execution result
        id: gemini_result
        if: always()
        env:
          TASK_MODE_INPUT: ${{ steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || '' }}
        shell: bash
        run: |
          set -uo pipefail

          # Determine task mode from server-derived descriptor if available
          DESCRIPTOR_FILE="execution-descriptor.json"
          if [ -f "$DESCRIPTOR_FILE" ] && [ -n "$TASK_MODE_INPUT" ]; then
            TASK_MODE="$TASK_MODE_INPUT"
          else
            TASK_MODE="REVIEW"
          fi

          GEMINI_OUTCOME="${{ steps.gemini_run.outcome }}"

          # Determine Gemini execution status from the actual step outcome.
          # Distinguish: dispatch accepted -> Gemini CLI executed -> succeeded/failed.
          # A GitHub 204 from workflow_dispatch only confirmed dispatch acceptance.
          if [ "$GEMINI_OUTCOME" = "success" ]; then
            STATUS="success"
            VERIFICATION_STATUS="PASS"
            BLOCKER_MSG=""
          elif [ "$GEMINI_OUTCOME" = "failure" ]; then
            STATUS="failure"
            VERIFICATION_STATUS="FAIL"
            BLOCKER_MSG="Gemini CLI execution failed (step outcome: failure)"
          else
            # skipped, cancelled, or empty -- Gemini did not execute successfully
            STATUS="failure"
            VERIFICATION_STATUS="FAIL"
            BLOCKER_MSG="Gemini workflow did not execute successfully (step outcome: ${GEMINI_OUTCOME:-none})"
          fi

          # Determine reconciliation status using the same contract as
          # determineReconciliationStatus() in poc/schemas/acp-schema.js:
          # VERIFY_RECONCILE + verification PASS -> COMPLETED
          # VERIFY_RECONCILE + verification FAIL -> SKIPPED
          # Other modes -> SKIPPED
          if [ "$TASK_MODE" = "VERIFY_RECONCILE" ]; then
            if [ "$VERIFICATION_STATUS" = "PASS" ]; then
              RECON_STATUS="COMPLETED"
            else
              RECON_STATUS="SKIPPED"
            fi
          else
            RECON_STATUS="SKIPPED"
          fi

          echo "gemini_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "verification_status=$VERIFICATION_STATUS" >> "$GITHUB_OUTPUT"
          echo "blocker_message=$BLOCKER_MSG" >> "$GITHUB_OUTPUT"
          echo "recon_status=$RECON_STATUS" >> "$GITHUB_OUTPUT"

      - name: Prepare ACP report payload
        id: callback_payload
        if: always()
        env:
          GEMINI_SUMMARY: ${{ steps.gemini_run.outputs.summary }}
          EXECUTION_CLAIM_ID: ${{ steps.orchestration_context_wfd.outputs.execution_claim_id || steps.orchestration_context_ic.outputs.execution_claim_id }}
          CARRIER_IDENTITY: ${{ steps.orchestration_context_wfd.outputs.carrier_identity || steps.orchestration_context_ic.outputs.carrier_identity }}
          IS_REPLAY: ${{ steps.validate_activation.outputs.replay == 'true' || steps.validate_activation_wfd.outputs.replay == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          # Derive ACP envelope fields from the SERVER-DERIVED execution descriptor.
          # The descriptor was returned by the canonical activation ingress and
          # persisted by poc/validate-external-activation.js. The request_id,
          # task, repository, base_branch, task_mode, capabilities, and
          # permitted_paths must all come from the descriptor — not from
          # workflow inputs — to preserve server-derived authority.
          DESCRIPTOR_FILE="execution-descriptor.json"
          if [ "$IS_REPLAY" = "true" ] && [ ! -f "$DESCRIPTOR_FILE" ]; then
            echo "::warning::Replay without descriptor file; using fallback values"
            REQUEST_ID=""
            TASK=""
            REPOSITORY="${{ github.repository }}"
            BASE_BRANCH="${{ github.ref_name }}"
            TASK_MODE="REVIEW"
          elif [ -f "$DESCRIPTOR_FILE" ]; then
            REQUEST_ID="$(jq -r '.request_id' "$DESCRIPTOR_FILE")"
            TASK="$(jq -r '.task' "$DESCRIPTOR_FILE" 2>/dev/null || echo '')"
            REPOSITORY="$(jq -r '.repository' "$DESCRIPTOR_FILE" 2>/dev/null || echo '${{ github.repository }}')"
            BASE_BRANCH="$(jq -r '.base_branch' "$DESCRIPTOR_FILE" 2>/dev/null || echo '${{ github.ref_name }}')"
          else
            echo "::error::Execution descriptor file not found for ACP report payload"
            exit 1
          fi

          CURRENT_HEAD_SHA="${GITHUB_SHA}"

          # Capture Gemini output (stdout from run-gemini-cli).
          # Transported via env: (GEMINI_SUMMARY) to avoid shell-interpolation
          # of uncontrolled/multiline Gemini content inside the Bash source.
          GEMINI_OUTPUT="$GEMINI_SUMMARY"

          # Use status determined from actual Gemini execution outcome.
          # Do NOT hardcode status=success: a green workflow does not
          # prove Gemini's semantic verification succeeded.
          STATUS="${{ steps.gemini_result.outputs.gemini_status }}"
          VERIFICATION_STATUS="${{ steps.gemini_result.outputs.verification_status }}"
          BLOCKER_MSG="${{ steps.gemini_result.outputs.blocker_message }}"
          RECON_STATUS="${{ steps.gemini_result.outputs.recon_status }}"

          # Build blockers array from the actual execution result
          if [ "$STATUS" = "failure" ]; then
            BLOCKERS=$(jq -n --arg msg "$BLOCKER_MSG" '[$msg]')
          else
            BLOCKERS="[]"
          fi

          # Build reconciliation fields based on determined status
          RECON_CHANGED_FILES="[]"
          if [ "$RECON_STATUS" = "COMPLETED" ]; then
            RECON_COMMIT_SHA="${GITHUB_SHA}"
          else
            RECON_COMMIT_SHA="null"
          fi

          # Build ACP execution report
          INVOCATION_ID="gemini-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RUN_ID="${GITHUB_RUN_ID}"

          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg agent "Gemini" \
            --arg status "$STATUS" \
            --arg task "$TASK" \
            --arg repository "$REPOSITORY" \
            --arg base_branch "$BASE_BRANCH" \
            --arg current_head_sha "$CURRENT_HEAD_SHA" \
            --arg gemini_output "$GEMINI_OUTPUT" \
            --arg invocation_id "$INVOCATION_ID" \
            --arg run_id "$RUN_ID" \
            --argjson blockers "$BLOCKERS" \
            --arg recon_status "$RECON_STATUS" \
            --argjson recon_changed_files "$RECON_CHANGED_FILES" \
            --arg recon_commit_sha "$RECON_COMMIT_SHA" \
            --arg execution_claim_id "$EXECUTION_CLAIM_ID" \
            --arg carrier_identity "$CARRIER_IDENTITY" \
            '{
              request_id: (if $request_id == "" then null else $request_id end),
              agent: $agent,
              status: $status,
              task: $task,
              repository: $repository,
              base_branch: $base_branch,
              current_head_sha: $current_head_sha,
              changed_files: [],
              verification: ["advisory review completed"],
              result: { execution_metadata: { invocation_id: $invocation_id, run_id: $run_id, carrier_identity: (if $carrier_identity == "" then null else $carrier_identity end), execution_claim_id: (if $execution_claim_id == "" then null else $execution_claim_id end) }, gemini_output: $gemini_output },
              commit: null,
              push: false,
              blockers: $blockers,
              reconciliation: {
                status: $recon_status,
                changed_files: $recon_changed_files,
                commit_sha: (if $recon_commit_sha == "null" then null else $recon_commit_sha end)
              }
            }' > callback_payload.json

          cp callback_payload.json gemini-acp-report.json

          cat callback_payload.json

          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Persist durable readable evidence projection
        if: always() && steps.callback_payload.outputs.request_id != ''
        env:
          REQUEST_ID: ${{ steps.callback_payload.outputs.request_id }}
          BASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "$REQUEST_ID" ]; then
            echo "::warning::REQUEST_ID is empty; skipping durable evidence projection"
            exit 0
          fi

          mkdir -p docs/ai/reports

          REPORT_PATH="docs/ai/reports/gemini-acp-report-${REQUEST_ID}.json"

          cp callback_payload.json "$REPORT_PATH"

          git config user.name "Gemini"
          git config user.email "gemini@users.noreply.github.com"
          git config --global --add safe.directory '*'

          git add "$REPORT_PATH"

          if git diff --cached --quiet "$REPORT_PATH"; then
            echo "No changes to stage for $REPORT_PATH"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "docs(evidence): persist durable Gemini ACP report projection for ${REQUEST_ID}" || {
            echo "::warning::Could not commit durable evidence projection (possibly already committed or up to date)"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          for i in 1 2 3; do
            git pull --rebase origin "${BASE_BRANCH}" && git push origin "${BASE_BRANCH}" && {
              echo "Pushed durable evidence projection: $COMMIT_SHA (attempt $i)"
              exit 0
            } || {
              echo "Push failed due to concurrent update, retrying ($i/3)..."
              git fetch origin "${BASE_BRANCH}"
              git rebase "origin/${BASE_BRANCH}" || {
                echo "::warning::Rebase failed during durable evidence push; evidence file remains created but not pushed"
                exit 0
              }
            }
          done

          echo "::warning::Durable evidence projection push did not succeed after 3 attempts"
          exit 0

      - name: Send callback to Render (workflow_dispatch only)
        id: send_callback
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          CALLBACK_URL: ${{ secrets.RENDER_GEMINI_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.GEMINI_CALLBACK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$CALLBACK_URL" ] || [ -z "$CALLBACK_SECRET" ]; then
            echo "::warning::Callback URL or secret not configured, skipping callback"
            echo "callback_sent=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-gemini-callback-secret: $CALLBACK_SECRET" \
            -d @callback_payload.json)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "Callback response: $HTTP_CODE"
          echo "Callback body: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "callback_sent=true" >> "$GITHUB_OUTPUT"
          else
            echo "callback_sent=false" >> "$GITHUB_OUTPUT"
            echo "::error::Callback failed with HTTP $HTTP_CODE: $BODY"
            exit 1
          fi

      - name: Upload Gemini result artifact
        id: upload_gemini_result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-acp-report
          path: gemini-acp-report.json
          retention-days: 7
          if-no-files-found: error

      - name: Report artifact filing status
        id: report_filing_status
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          UPLOAD_OUTCOME="${{ steps.upload_gemini_result.outcome }}"

          case "$UPLOAD_OUTCOME" in
            success)
              STATUS="SUCCESS"
              ;;
            failure)
              STATUS="FAILED"
              ;;
            *)
              STATUS="UNKNOWN"
              ;;
          esac

          {
            echo "## Gemini ACP Report Artifact Filing Status"
            echo ""
            echo "The \`gemini-acp-report\` artifact upload step outcome was: \`${UPLOAD_OUTCOME:-unavailable}\`"
            echo ""
            echo "filing_status: ${STATUS}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "filing_status=${STATUS}" >> "$GITHUB_OUTPUT"
