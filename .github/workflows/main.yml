name: Gemini Architect and Failover Agent

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      authorized_files:
        description: 'Comma-separated list of files authorized for modification in failover mode'
        required: false
        type: string
        default: ''

jobs:
  advisory:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '@gemini-cli') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        !contains(github.event.comment.body, 'ACTIVATE TEMPORARY CODEX FAILOVER MODE')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Gemini request
        id: request
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          REQUEST="${COMMENT_BODY#@gemini-cli}"
          REQUEST="${REQUEST# }"

          {
            echo 'request<<EOF'
            printf '%s\n' "$REQUEST"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Gemini in advisory mode
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          github_issue_number: ${{ github.event.issue.number }}
          github_pr_number: ${{ github.event.pull_request.number }}
          prompt: |
            You are Gemini, the Fluent with Kyle OpenClaw project's
            Architect, Reviewer, and Research agent.

            MODE: NORMAL ADVISORY MODE

            In this mode you are advisory only.

            You may:
            - inspect the repository;
            - inspect ARCHITECTURE.md and GEMINI.md;
            - analyze architecture and implementation;
            - review code and integrations;
            - research repository state;
            - produce implementation plans;
            - identify affected files, risks, validation steps, and
              acceptance criteria.

            You must NOT:
            - modify repository files;
            - create, modify, rename, move, or delete files;
            - commit or push;
            - create or merge pull requests;
            - otherwise change repository state.

            The request below was explicitly submitted by a trusted
            repository collaborator through the @gemini-cli interface.

            Treat that request as the actual task.

            --- REQUEST START ---
            ${{ steps.request.outputs.request || 'Provide an architecture/status assessment of the current repository.' }}
            --- REQUEST END ---

            Read ARCHITECTURE.md and GEMINI.md before responding.
            Distinguish observations from recommendations.
            Return a concrete, actionable response for the project.

  failover:
    if: >-
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, '@gemini-cli') &&
      contains(github.event.comment.body, 'ACTIVATE TEMPORARY CODEX FAILOVER MODE') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Gemini failover request
        id: request
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          REQUEST="${COMMENT_BODY#@gemini-cli}"
          REQUEST="${REQUEST# }"

          {
            echo 'request<<EOF'
            printf '%s\n' "$REQUEST"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Extract authorized files from issue comment
        id: authorized_files
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          # Parse AUTHORIZED_FILES from comment body
          # Expected format: a line starting with "AUTHORIZED_FILES:" followed by comma-separated paths
          # Example: AUTHORIZED_FILES: ai-models/, package.json, package-lock.json
          AUTHORIZED_FILES_RAW="$(printf '%s\n' "$COMMENT_BODY" | grep -i '^AUTHORIZED_FILES:' | head -1 | sed 's/^[^:]*: *//')"

          if [ -z "$AUTHORIZED_FILES_RAW" ]; then
            echo "==========================================="
            echo "FAILOVER CONFIGURATION ERROR: Missing AUTHORIZED_FILES declaration"
            echo "==========================================="
            echo "Issue-comment failover requires an explicit AUTHORIZED_FILES line in the comment."
            echo "Format: AUTHORIZED_FILES: path1, path2, path3"
            echo "Example: AUTHORIZED_FILES: ai-models/, package.json, package-lock.json"
            echo ""
            echo "Directory prefixes (ending with /) and exact files are supported."
            echo "STOPPING: No failover execution without authorized scope."
            exit 1
          fi

          # Split comma-separated, trim whitespace, deduplicate
          AUTHORIZED_FILES="$(printf '%s\n' "$AUTHORIZED_FILES_RAW" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | sed '/^$/d' | sort -u)"

          echo "Authorized files from comment:"
          printf '%s\n' "$AUTHORIZED_FILES" | sed 's/^/  /'

          {
            echo 'authorized_files<<EOF'
            printf '%s\n' "$AUTHORIZED_FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Capture pre-Gemini repository state (content-based baseline)
        id: pre_state
        shell: bash
        run: |
          set -euo pipefail

          # Capture Git history baseline
          PRE_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          PRE_HEAD_SHA="$(git rev-parse HEAD)"
          PRE_REF_NAME="${GITHUB_REF_NAME}"

          # Capture content-based baseline for ALL tracked files (not just modified)
          # This allows detecting additional modifications to files already changed before Gemini
          PRE_TRACKED_HASHES="$(git ls-files -z | xargs -0 git hash-object 2>/dev/null | paste -d' ' - <(git ls-files) | sort)"

          # Capture pre-existing staged files
          PRE_STAGED="$(git diff --cached --name-only | sort -u)"
          # Capture pre-existing staged content hashes
          PRE_STAGED_HASHES="$(git diff --cached --name-only -z | xargs -0 git hash-object 2>/dev/null | paste -d' ' - <(git diff --cached --name-only) | sort)"

          # Capture pre-existing untracked files AND their content hashes
          PRE_UNTRACKED="$(git ls-files --others --exclude-standard | sort -u)"
          PRE_UNTRACKED_HASHES=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              HASH="$(git hash-object "$file")"
              PRE_UNTRACKED_HASHES="${PRE_UNTRACKED_HASHES}${HASH} ${file}\n"
            fi
          done <<< "$PRE_UNTRACKED"
          PRE_UNTRACKED_HASHES="$(printf '%s' "$PRE_UNTRACKED_HASHES" | sort)"

          # Capture worktree modifications (tracked files with unstaged changes)
          PRE_WORKTREE="$(git diff --name-only | sort -u)"
          # Capture worktree content hashes (actual content on disk)
          PRE_WORKTREE_HASHES=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              HASH="$(git hash-object "$file")"
              PRE_WORKTREE_HASHES="${PRE_WORKTREE_HASHES}${HASH} ${file}\n"
            fi
          done <<< "$PRE_WORKTREE"
          PRE_WORKTREE_HASHES="$(printf '%s' "$PRE_WORKTREE_HASHES" | sort)"

          PRE_DELETED="$(git diff --name-only --diff-filter=D | sort -u)"

          {
            echo 'pre_branch<<EOF'
            printf '%s\n' "$PRE_BRANCH"
            echo 'EOF'
            echo 'pre_head_sha<<EOF'
            printf '%s\n' "$PRE_HEAD_SHA"
            echo 'EOF'
            echo 'pre_ref_name<<EOF'
            printf '%s\n' "$PRE_REF_NAME"
            echo 'EOF'
            echo 'pre_tracked_hashes<<EOF'
            printf '%s\n' "$PRE_TRACKED_HASHES"
            echo 'EOF'
            echo 'pre_staged<<EOF'
            printf '%s\n' "$PRE_STAGED"
            echo 'EOF'
            echo 'pre_staged_hashes<<EOF'
            printf '%s\n' "$PRE_STAGED_HASHES"
            echo 'EOF'
            echo 'pre_untracked<<EOF'
            printf '%s\n' "$PRE_UNTRACKED"
            echo 'EOF'
            echo 'pre_untracked_hashes<<EOF'
            printf '%s\n' "$PRE_UNTRACKED_HASHES"
            echo 'EOF'
            echo 'pre_worktree<<EOF'
            printf '%s\n' "$PRE_WORKTREE"
            echo 'EOF'
            echo 'pre_worktree_hashes<<EOF'
            printf '%s\n' "$PRE_WORKTREE_HASHES"
            echo 'EOF'
            echo 'pre_deleted<<EOF'
            printf '%s\n' "$PRE_DELETED"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          echo "Pre-Gemini state captured (content-based):"
          echo "  Branch: $PRE_BRANCH"
          echo "  HEAD SHA: $PRE_HEAD_SHA"
          echo "  Ref: $PRE_REF_NAME"
          echo "  Tracked files: $(printf '%s\n' "$PRE_TRACKED_HASHES" | wc -l) files"
          echo "  Staged: $(printf '%s\n' "$PRE_STAGED" | wc -l) files"
          echo "  Untracked: $(printf '%s\n' "$PRE_UNTRACKED" | wc -l) files"
          echo "  Worktree modified: $(printf '%s\n' "$PRE_WORKTREE" | wc -l) files"
          echo "  Deleted: $(printf '%s\n' "$PRE_DELETED" | wc -l) files"

      - name: Run Gemini in temporary Codex failover mode
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          github_issue_number: ${{ github.event.issue.number }}
          github_pr_number: ${{ github.event.pull_request.number }}
          prompt: |
            You are Gemini, the Fluent with Kyle OpenClaw project's
            Architect, Reviewer, and Research agent.

            MODE: TEMPORARY CODEX FAILOVER MODE

            The repository workflow has independently verified that:
            1. this request came from a trusted repository collaborator; and
            2. the request explicitly contains:
               ACTIVATE TEMPORARY CODEX FAILOVER MODE

            This is an explicit emergency role substitution.

            Codex is currently unavailable.

            You are therefore temporarily assuming the repository
            implementation responsibilities normally assigned to Codex.

            This authority applies ONLY to this workflow run and task.
            It does not permanently change the project's architecture or
            your normal Gemini role.

            In this mode you may:
            - inspect files;
            - modify authorized files;
            - run tests and validation;
            - debug implementation issues.

            You must NOT:
            - commit;
            - push;
            - create branches;
            - create or merge pull requests;
            - alter Git history;
            - move or reset refs.

            The workflow, not Gemini, owns repository persistence.

            You retain your normal Architect and Reviewer responsibilities.

            Rules:
            1. Read ARCHITECTURE.md and GEMINI.md first.
            2. Preserve existing application behavior.
            3. Make the smallest verified changes necessary.
            4. Do not perform broad rewrites.
            5. Do not change business logic unless explicitly required.
            6. Do not expose or commit secrets.
            7. Clearly identify every file changed.
            8. Run focused tests and validation.
            9. Report exactly what was implemented.
            10. Report exactly what was verified.
            11. Report anything that remains blocked.
            12. Explicitly identify the work as performed under
                TEMPORARY CODEX FAILOVER MODE.

            IMPORTANT REPOSITORY PERSISTENCE RULE:
            You are operating inside the checked-out GitHub repository.
            If the requested task requires repository changes, you MUST
            actually modify the files in the workspace. Do not merely
            describe the changes or provide a proposed patch in your
            response. The workflow will verify and persist your changes
            after this step.

            The trusted collaborator's request is below.

            --- REQUEST START ---
            ${{ steps.request.outputs.request }}
            --- REQUEST END ---

            Execute the requested implementation task now.

      - name: Verify and persist failover changes
        shell: bash
        env:
          REQUEST: ${{ steps.request.outputs.request }}
          AUTHORIZED_FILES_INPUT: ${{ github.event.inputs.authorized_files }}
          AUTHORIZED_FILES_COMMENT: ${{ steps.authorized_files.outputs.authorized_files }}
          PRE_BRANCH: ${{ steps.pre_state.outputs.pre_branch }}
          PRE_HEAD_SHA: ${{ steps.pre_state.outputs.pre_head_sha }}
          PRE_REF_NAME: ${{ steps.pre_state.outputs.pre_ref_name }}
          PRE_TRACKED_HASHES: ${{ steps.pre_state.outputs.pre_tracked_hashes }}
          PRE_STAGED: ${{ steps.pre_state.outputs.pre_staged }}
          PRE_STAGED_HASHES: ${{ steps.pre_state.outputs.pre_staged_hashes }}
          PRE_UNTRACKED: ${{ steps.pre_state.outputs.pre_untracked }}
          PRE_UNTRACKED_HASHES: ${{ steps.pre_state.outputs.pre_untracked_hashes }}
          PRE_WORKTREE: ${{ steps.pre_state.outputs.pre_worktree }}
          PRE_WORKTREE_HASHES: ${{ steps.pre_state.outputs.pre_worktree_hashes }}
          PRE_DELETED: ${{ steps.pre_state.outputs.pre_deleted }}
        run: |
          set -euo pipefail

          # ============================================================
          # GIT HISTORY PROTECTION - Verify no commits or ref changes
          # ============================================================
          echo "=== GIT HISTORY PROTECTION GATE ==="
          POST_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          POST_HEAD_SHA="$(git rev-parse HEAD)"
          POST_REF_NAME="${GITHUB_REF_NAME}"

          if [ "$PRE_BRANCH" != "$POST_BRANCH" ]; then
            echo "==========================================="
            echo "HISTORY PROTECTION FAILED: Branch changed"
            echo "==========================================="
            echo "Pre-Gemini branch:  $PRE_BRANCH"
            echo "Post-Gemini branch: $POST_BRANCH"
            echo "STOPPING: No commit, no push."
            exit 1
          fi

          if [ "$PRE_HEAD_SHA" != "$POST_HEAD_SHA" ]; then
            echo "==========================================="
            echo "HISTORY PROTECTION FAILED: HEAD SHA changed (commits created)"
            echo "==========================================="
            echo "Pre-Gemini HEAD:  $PRE_HEAD_SHA"
            echo "Post-Gemini HEAD: $POST_HEAD_SHA"
            echo "Gemini created commits - this is not permitted."
            echo "STOPPING: No commit, no push."
            exit 1
          fi

          if [ "$PRE_REF_NAME" != "$POST_REF_NAME" ]; then
            echo "==========================================="
            echo "HISTORY PROTECTION FAILED: Ref name changed"
            echo "==========================================="
            echo "Pre-Gemini ref:  $PRE_REF_NAME"
            echo "Post-Gemini ref: $POST_REF_NAME"
            echo "STOPPING: No commit, no push."
            exit 1
          fi

          echo "Git history protection PASSED: Branch, HEAD, and ref unchanged."

          # ============================================================
          # COMMIT BOUNDARY HARDENING - GEMINI FAILOVER SCOPE GATE
          # ============================================================

          # Parse authorized files based on trigger type
          # workflow_dispatch: uses AUTHORIZED_FILES_INPUT (comma-separated)
          # issue_comment: uses AUTHORIZED_FILES_COMMENT (newline-separated from extraction step)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$AUTHORIZED_FILES_INPUT" ]; then
              # Split comma-separated input into newline-separated list
              AUTHORIZED_FILES="$(printf '%s\n' "$AUTHORIZED_FILES_INPUT" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | sed '/^$/d' | sort -u)"
            else
              echo "==========================================="
              echo "FAILOVER CONFIGURATION ERROR: Missing authorized_files input"
              echo "==========================================="
              echo "workflow_dispatch failover requires the authorized_files input."
              echo "STOPPING: No commit, no push."
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            if [ -n "$AUTHORIZED_FILES_COMMENT" ]; then
              # Already newline-separated and deduplicated from extraction step
              AUTHORIZED_FILES="$AUTHORIZED_FILES_COMMENT"
            else
              echo "==========================================="
              echo "FAILOVER CONFIGURATION ERROR: Missing authorized_files from comment"
              echo "==========================================="
              echo "issue_comment failover requires AUTHORIZED_FILES in the comment."
              echo "STOPPING: No commit, no push."
              exit 1
            fi
          else
            echo "==========================================="
            echo "FAILOVER CONFIGURATION ERROR: Unknown event type"
            echo "==========================================="
            echo "Event: $GITHUB_EVENT_NAME"
            echo "STOPPING: No commit, no push."
            exit 1
          fi

          echo "=== COMMIT SCOPE GATE ==="
          echo "Authorized files:"
          printf '%s\n' "$AUTHORIZED_FILES" | sed 's/^/  /'

          # --------------------------------------------------------------------------
          # CAPTURE POST-GEMINI STATE (CONTENT-BASED)
          # --------------------------------------------------------------------------
          POST_TRACKED_HASHES="$(git ls-files -z | xargs -0 git hash-object 2>/dev/null | paste -d' ' - <(git ls-files) | sort)"
          POST_STAGED="$(git diff --cached --name-only | sort -u)"
          POST_STAGED_HASHES="$(git diff --cached --name-only -z | xargs -0 git hash-object 2>/dev/null | paste -d' ' - <(git diff --cached --name-only) | sort)"
          POST_UNTRACKED="$(git ls-files --others --exclude-standard | sort -u)"
          POST_UNTRACKED_HASHES=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              HASH="$(git hash-object "$file")"
              POST_UNTRACKED_HASHES="${POST_UNTRACKED_HASHES}${HASH} ${file}\n"
            fi
          done <<< "$POST_UNTRACKED"
          POST_UNTRACKED_HASHES="$(printf '%s' "$POST_UNTRACKED_HASHES" | sort)"

          POST_WORKTREE="$(git diff --name-only | sort -u)"
          POST_WORKTREE_HASHES=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              HASH="$(git hash-object "$file")"
              POST_WORKTREE_HASHES="${POST_WORKTREE_HASHES}${HASH} ${file}\n"
            fi
          done <<< "$POST_WORKTREE"
          POST_WORKTREE_HASHES="$(printf '%s' "$POST_WORKTREE_HASHES" | sort)"

          POST_DELETED="$(git diff --name-only --diff-filter=D | sort -u)"

          # --------------------------------------------------------------------------
          # COMPUTE GEMINI'S ACTUAL CHANGES USING CONTENT HASH COMPARISON
          # --------------------------------------------------------------------------
          # A file is considered "changed by Gemini" if its content hash differs from pre-state
          # This catches:
          # 1. Additional modifications to files already modified before Gemini (pre-worktree)
          # 2. Modifications to pre-existing untracked files
          # 3. New files created by Gemini
          # 4. Deletions
          #
          # LIMITATION: This state-detection mechanism uses `git hash-object` which computes
          # the blob hash of file contents as stored in Git's object database. Repositories
          # with .gitattributes filters (e.g., clean/smudge filters, LFS, git-crypt) or very
          # large/binary files may produce hashes that do not reflect the working-tree content
          # directly, requiring additional handling for accurate change detection.

          # Build a map of pre-state hashes for all files that existed before
          # We need to track: tracked files, staged files, untracked files, worktree files

          # Function to extract hash for a file from a hash list
          # Uses exact string matching (not regex) to handle filenames with spaces,
          # regex metacharacters, brackets, parentheses, dots, and other valid Git path characters.
          get_hash() {
            local file="$1"
            local hash_list="$2"
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              # Each line format: "40-char-hash filename"
              # Hash is exactly 40 hex chars, followed by a space, then the filename
              local hash="${line:0:40}"
              local fname="${line:41}"
              if [ "$fname" = "$file" ]; then
                printf '%s\n' "$hash"
                return 0
              fi
            done <<< "$hash_list"
            return 1
          }

          # Collect all files that exist in post-state
          ALL_POST_FILES="$(printf '%s\n%s\n%s\n' "$(git ls-files)" "$POST_UNTRACKED" "$POST_DELETED" | sort -u | sed '/^$/d')"

          GEMINI_CHANGED_FILES=""
          GEMINI_NEW_UNTRACKED=""
          GEMINI_DELETED=""

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            PRE_HASH=""
            POST_HASH=""

            # Check if file was tracked before
            PRE_HASH="$(get_hash "$file" "$PRE_TRACKED_HASHES")"

            # Check if file was untracked before
            if [ -z "$PRE_HASH" ]; then
              PRE_HASH="$(get_hash "$file" "$PRE_UNTRACKED_HASHES")"
            fi

            # Check if file is in post tracked
            POST_HASH="$(get_hash "$file" "$POST_TRACKED_HASHES")"

            # Check if file is in post untracked
            if [ -z "$POST_HASH" ]; then
              POST_HASH="$(get_hash "$file" "$POST_UNTRACKED_HASHES")"
            fi

            # Determine change type
            if [ -z "$PRE_HASH" ] && [ -n "$POST_HASH" ]; then
              # New file (was not tracked or untracked before)
              GEMINI_NEW_UNTRACKED="${GEMINI_NEW_UNTRACKED}${file}\n"
            elif [ -n "$PRE_HASH" ] && [ -z "$POST_HASH" ]; then
              # Deleted file
              GEMINI_DELETED="${GEMINI_DELETED}${file}\n"
            elif [ -n "$PRE_HASH" ] && [ -n "$POST_HASH" ] && [ "$PRE_HASH" != "$POST_HASH" ]; then
              # Content changed (includes additional modifications to pre-modified files)
              GEMINI_CHANGED_FILES="${GEMINI_CHANGED_FILES}${file}\n"
            fi
          done <<< "$ALL_POST_FILES"

          # Also check for deletions that might not be in ALL_POST_FILES (already deleted)
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! printf '%s\n' "$PRE_DELETED" | grep -qxF "$file"; then
              GEMINI_DELETED="${GEMINI_DELETED}${file}\n"
            fi
          done <<< "$POST_DELETED"

          GEMINI_CHANGED_FILES="$(printf '%s' "$GEMINI_CHANGED_FILES" | sort -u | sed '/^$/d')"
          GEMINI_NEW_UNTRACKED="$(printf '%s' "$GEMINI_NEW_UNTRACKED" | sort -u | sed '/^$/d')"
          GEMINI_DELETED="$(printf '%s' "$GEMINI_DELETED" | sort -u | sed '/^$/d')"

          # All files changed by Gemini (union)
          ALL_GEMINI_CHANGES="$(printf '%s\n%s\n%s\n' "$GEMINI_CHANGED_FILES" "$GEMINI_NEW_UNTRACKED" "$GEMINI_DELETED" | sort -u | sed '/^$/d')"

          echo "=== GEMINI CHANGES DETECTED (CONTENT-BASED) ==="
          if [ -z "$ALL_GEMINI_CHANGES" ]; then
            echo "ERROR: Gemini completed without producing any repository changes."
            echo "Failover implementation was not persisted."
            exit 1
          fi

          echo "Modified (content changed):"
          printf '%s\n' "$GEMINI_CHANGED_FILES" | sed 's/^/  /'
          echo "New untracked:"
          printf '%s\n' "$GEMINI_NEW_UNTRACKED" | sed 's/^/  /'
          echo "Deleted:"
          printf '%s\n' "$GEMINI_DELETED" | sed 's/^/  /'

          # Show diff summary for Gemini's changes only
          echo "=== GEMINI DIFF SUMMARY ==="
          if [ -n "$GEMINI_CHANGED_FILES" ]; then
            # Use array to handle filenames with spaces
            mapfile -t changed_array <<< "$GEMINI_CHANGED_FILES"
            git diff --stat "${changed_array[@]}" 2>/dev/null || true
          fi
          if [ -n "$GEMINI_NEW_UNTRACKED" ]; then
            echo "New untracked files (content):"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              echo "  $file ($(wc -c < "$file") bytes)"
            done <<< "$GEMINI_NEW_UNTRACKED"
          fi
          if [ -n "$GEMINI_DELETED" ]; then
            echo "Deleted files:"
            printf '%s\n' "$GEMINI_DELETED" | sed 's/^/  /'
          fi

          # --------------------------------------------------------------------------
          # PROTECTION: PRE-EXISTING STAGED FILES
          # --------------------------------------------------------------------------
          # Ensure no pre-existing staged files exist that could contaminate the commit
          if [ -n "$PRE_STAGED" ]; then
            echo "==========================================="
            echo "COMMIT GATE FAILED: Pre-existing staged files detected"
            echo "==========================================="
            echo "The following files were already staged BEFORE Gemini ran:"
            printf '%s\n' "$PRE_STAGED" | sed 's/^/  /'
            echo "These could contaminate the commit. STOPPING: No commit, no push."
            exit 1
          fi

          # Also verify pre-staged content hasn't been secretly modified
          # (though PRE_STAGED check above should catch the presence of any)

          # --------------------------------------------------------------------------
          # PROTECTION: PRE-EXISTING UNTRACKED FILES MODIFIED BY GEMINI
          # --------------------------------------------------------------------------
          # Check if any pre-existing untracked file was modified (content hash changed)
          UNTRACKED_MODIFIED=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            PRE_HASH="$(get_hash "$file" "$PRE_UNTRACKED_HASHES")"
            POST_HASH="$(get_hash "$file" "$POST_UNTRACKED_HASHES")"
            if [ -n "$PRE_HASH" ] && [ -n "$POST_HASH" ] && [ "$PRE_HASH" != "$POST_HASH" ]; then
              UNTRACKED_MODIFIED="${UNTRACKED_MODIFIED}${file}\n"
            fi
          done <<< "$PRE_UNTRACKED"

          if [ -n "$UNTRACKED_MODIFIED" ]; then
            echo "==========================================="
            echo "COMMIT GATE FAILED: Pre-existing untracked files modified by Gemini"
            echo "==========================================="
            echo "The following untracked files existed before Gemini and were modified:"
            printf '%s' "$UNTRACKED_MODIFIED" | sed 's/^/  /'
            echo "These changes are NOT authorized unless the files are in the authorized list."
            echo "STOPPING: No commit, no push."
            exit 1
          fi

          # --------------------------------------------------------------------------
          # SCOPE CHECK: Verify ALL Gemini changes are within authorized scope
          # --------------------------------------------------------------------------
          echo "=== SCOPE CHECK ==="

          # Function to check if a file is authorized
          # Supports exact file matches and directory prefixes (ending with /)
          is_authorized() {
            local file="$1"
            local auth_list="$2"
            while IFS= read -r auth; do
              [ -z "$auth" ] && continue
              # Directory prefix match (ends with /)
              if [ "${auth: -1}" = "/" ]; then
                if [[ "$file" == "$auth"* ]]; then
                  return 0
                fi
              # Exact file match
              elif [ "$auth" = "$file" ]; then
                return 0
              fi
            done <<< "$auth_list"
            return 1
          }

          UNAUTHORIZED_FILES=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! is_authorized "$file" "$AUTHORIZED_FILES"; then
              UNAUTHORIZED_FILES="${UNAUTHORIZED_FILES}${file}\n"
            fi
          done <<< "$ALL_GEMINI_CHANGES"

          if [ -n "$UNAUTHORIZED_FILES" ]; then
            echo "==========================================="
            echo "COMMIT GATE FAILED: Unauthorized files changed"
            echo "==========================================="
            echo "The following files are NOT in the authorized scope:"
            printf '%s' "$UNAUTHORIZED_FILES"
            echo "Authorized scope:"
            printf '%s\n' "$AUTHORIZED_FILES" | sed 's/^/  /'
            echo ""
            echo "STOPPING: No commit, no push."
            exit 1
          fi

          echo "Scope check PASSED: All Gemini changes are within authorized scope."

          # --------------------------------------------------------------------------
          # STAGE ONLY AUTHORIZED FILES (no git add -A)
          # --------------------------------------------------------------------------
          echo "=== STAGING AUTHORIZED FILES ==="

          # Stage all modified/new files that are within authorized scope
          # This includes both exact matches and directory prefix matches
          ALL_POST_TRACKED="$(git ls-files | sort -u)"
          ALL_POST_UNTRACKED="$(git ls-files --others --exclude-standard | sort -u)"
          ALL_POST_FILES_STAGE="$(printf '%s\n%s\n' "$ALL_POST_TRACKED" "$ALL_POST_UNTRACKED" | sort -u | sed '/^$/d')"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if is_authorized "$file" "$AUTHORIZED_FILES"; then
              if [ -f "$file" ]; then
                git add "$file"
                echo "  Staged (modified/new): $file"
              elif git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
                # File exists in index but may be deleted in worktree
                git add "$file"
                echo "  Staged (tracked): $file"
              fi
            fi
          done <<< "$ALL_POST_FILES_STAGE"

          # Stage authorized deletions
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if is_authorized "$file" "$AUTHORIZED_FILES"; then
              git rm "$file" 2>/dev/null || true
              echo "  Staged (deletion): $file"
            fi
          done <<< "$GEMINI_DELETED"

          if git diff --cached --quiet; then
            echo "ERROR: No staged changes remain after scope-gated staging."
            exit 1
          fi

          # --------------------------------------------------------------------------
          # FINAL CACHED DIFF VERIFICATION GATE
          # --------------------------------------------------------------------------
          echo "=== FINAL CACHED DIFF VERIFICATION ==="
          echo "Verifying cached diff contains ONLY authorized changes..."

          # Get files in the cached diff
          CACHED_DIFF_FILES="$(git diff --cached --name-only | sort -u)"
          CACHED_DIFF_DELETED="$(git diff --cached --name-only --diff-filter=D | sort -u)"
          ALL_CACHED_FILES="$(printf '%s\n%s\n' "$CACHED_DIFF_FILES" "$CACHED_DIFF_DELETED" | sort -u | sed '/^$/d')"

          # Verify every file in cached diff is authorized (supports dir prefixes)
          CACHED_UNAUTHORIZED=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! is_authorized "$file" "$AUTHORIZED_FILES"; then
              CACHED_UNAUTHORIZED="${CACHED_UNAUTHORIZED}${file}\n"
            fi
          done <<< "$ALL_CACHED_FILES"

          if [ -n "$CACHED_UNAUTHORIZED" ]; then
            echo "==========================================="
            echo "FINAL GATE FAILED: Unauthorized files in cached diff"
            echo "==========================================="
            printf '%s' "$CACHED_UNAUTHORIZED"
            echo "STOPPING: No commit, no push."
            exit 1
          fi

          # Show the final diff for review
          echo "Final cached diff:"
          git diff --cached --stat
          git diff --cached

          # --------------------------------------------------------------------------
          # DIFF CHECK GATE (whitespace, etc.)
          # --------------------------------------------------------------------------
          echo "=== GIT DIFF --CHECK GATE ==="
          if ! git diff --cached --check; then
            echo "==========================================="
            echo "FINAL GATE FAILED: git diff --check reported errors"
            echo "==========================================="
            echo "STOPPING: No commit, no push."
            exit 1
          fi
          echo "git diff --check PASSED."

          # --------------------------------------------------------------------------
          # REJECT ARTIFACT FILES
          # --------------------------------------------------------------------------
          echo "=== ARTIFACT FILE REJECTION GATE ==="
          ARTIFACT_PATTERNS=("*.log" "*.tmp" "*.temp" "*.swp" "*.swo" "*~" ".DS_Store" "Thumbs.db" "*.orig" "*.rej" "*.bak" "*.backup")
          ARTIFACT_FOUND=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            for pattern in "${ARTIFACT_PATTERNS[@]}"; do
              # Use case-insensitive match for common artifact patterns
              if [[ "${file,,}" == ${pattern,,} ]] || [[ "${file##*/}" == ${pattern} ]]; then
                ARTIFACT_FOUND="${ARTIFACT_FOUND}${file} (matches ${pattern})\n"
              fi
            done
          done <<< "$ALL_CACHED_FILES"

          if [ -n "$ARTIFACT_FOUND" ]; then
            echo "==========================================="
            echo "FINAL GATE FAILED: Artifact files in cached diff"
            echo "==========================================="
            printf '%s' "$ARTIFACT_FOUND"
            echo "STOPPING: No commit, no push."
            exit 1
          fi
          echo "Artifact rejection gate PASSED."

          # --------------------------------------------------------------------------
          # REJECT UNEXPECTED DELETIONS
          # --------------------------------------------------------------------------
          echo "=== UNEXPECTED DELETION REJECTION GATE ==="
          # Any deletion in the cached diff must be explicitly in GEMINI_DELETED and authorized
          UNEXPECTED_DELETIONS=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # Check if this deletion was detected as a Gemini change
            if ! printf '%s\n' "$GEMINI_DELETED" | grep -qxF "$file"; then
              UNEXPECTED_DELETIONS="${UNEXPECTED_DELETIONS}${file}\n"
            fi
          done <<< "$CACHED_DIFF_DELETED"

          if [ -n "$UNEXPECTED_DELETIONS" ]; then
            echo "==========================================="
            echo "FINAL GATE FAILED: Unexpected deletions in cached diff"
            echo "==========================================="
            printf '%s' "$UNEXPECTED_DELETIONS"
            echo "STOPPING: No commit, no push."
            exit 1
          fi
          echo "Unexpected deletion rejection gate PASSED."

          # --------------------------------------------------------------------------
          # COMMIT AND PUSH
          # --------------------------------------------------------------------------
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Build commit message (avoid multi-line string in YAML literal block)
          COMMIT_MSG="Gemini temporary Codex failover implementation\n\nAuthorized scope: $(printf '%s' "$AUTHORIZED_FILES" | tr '\n' ',' | sed 's/,$//')\nTask: $REQUEST"
          printf '%b' "$COMMIT_MSG" > /tmp/commit_msg.txt
          git commit -F /tmp/commit_msg.txt

          git push origin HEAD:${GITHUB_REF_NAME}

          echo "Verifying pushed repository state..."
          git fetch origin "${GITHUB_REF_NAME}"
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse "origin/${GITHUB_REF_NAME}")"

          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "ERROR: Push verification failed."
            echo "Local:  $LOCAL_SHA"
            echo "Remote: $REMOTE_SHA"
            exit 1
          fi

          echo "Failover changes successfully committed and pushed: $LOCAL_SHA"