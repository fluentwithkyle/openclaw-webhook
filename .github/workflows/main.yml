name: Gemini Architect and Reviewer

# This comment exists solely to force GitHub workflow re-registration (TASK-KILO-GITHUB-WORKFLOW-TRIGGER-REREGISTRATION-001)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Correlation request ID for Kilo->Gemini orchestration'
        required: true
        type: string
      task:
        description: 'Task description for Gemini execution'
        required: true
        type: string
      task_name:
        description: 'Canonical ACP task identifier for the activation (required for consequential task_modes: FAILOVER_EXECUTE, BUILDER, RESEARCH_DOCUMENT)'
        required: false
        type: string
      repository:
        description: 'Repository name (owner/repo)'
        required: true
        type: string
      base_branch:
        description: 'Base branch for the task'
        required: true
        type: string
      kilo_execution_id:
        description: 'Optional Kilo execution identifier from completed Kilo run (if Builder was triggered after Kilo completion)'
        required: false
        type: string
      builder_execution_id:
        description: 'Optional Builder execution identifier (for correlation with Gemini Builder workflow)'
        required: false
        type: string
      verification:
        description: 'Original ACP task verification requirements for Gemini review'
        required: false
        type: string
      approval_id:
        description: 'Director approval identifier for consequential FAILOVER_EXECUTE activation'
        required: false
        type: string
      task_mode:
        description: 'Operating mode: REVIEW (read-only), VERIFY_RECONCILE (bounded commit/push), RESEARCH_DOCUMENT (research + documentation persistence), or FAILOVER_EXECUTE (full execution). PLAN and EXECUTE are conceptual Director-facing modes, not runtime values — rejected at the canonical ingress.'
        required: false
        type: string
        default: 'REVIEW'
      capabilities:
        description: 'Comma-separated authorized capabilities (e.g. read_only,modify_files,commit,push)'
        required: false
        type: string
        default: 'read_only'
      permitted_paths:
        description: 'Comma-separated authorized file paths for verification/reconciliation'
        required: false
        type: string

jobs:
  advisory:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '@gemini-cli') &&
        github.event.comment.user.login == 'fluentwithkyle'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract Gemini request (issue_comment)
        id: request_comment
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          # The @gemini-cli issue_comment activation surface resolves to REVIEW
          # (read-only advisory) by default. An embedded ACP descriptor in the
          # comment body may carry candidate task text, but the task_mode,
          # capabilities, and permitted_paths are NEVER derived from the comment
          # unless the comment author is the explicitly trusted Director identity
          # (fluentwithkyle) and the DIRECTOR_ORIGIN_SECRET is provided. The
          # canonical activation ingress server-derives these authority-bearing
          # fields from the server-side activation-policy authority. The effective
          # task_mode, capabilities, and permitted_paths for Gemini execution are
          # derived from the server-returned execution descriptor — NOT from
          # comment prefix parsing or embedded JSON alone.

          REQUEST="${COMMENT_BODY#@gemini-cli}"
          REQUEST="${REQUEST# }"

          # Default candidate values for non-Director issue comments: REVIEW (read-only).
          # Director-authorized comments with valid embedded descriptors preserve
          # their task_mode through the canonical activation ingress.
          CANDIDATE_TASK_MODE="REVIEW"
          CANDIDATE_CAPABILITIES="read_only"
          CANDIDATE_PERMITTED_PATHS="poc/"

          {
            echo 'request<<EOF'
            printf '%s\n' "$REQUEST"
            echo 'EOF'
            echo "task_mode=$CANDIDATE_TASK_MODE"
            echo "capabilities=$CANDIDATE_CAPABILITIES"
            echo "permitted_paths=$CANDIDATE_PERMITTED_PATHS"
          } >> "$GITHUB_OUTPUT"

      - name: Validate external activation through canonical ingress (issue_comment)
        id: validate_activation
        if: github.event_name == 'issue_comment'
        env:
          CALLBACK_BASE_URL: ${{ secrets.RENDER_CALLBACK_BASE_URL }}
          ACP_POC_TRIGGER_SECRET: ${{ secrets.ACP_POC_TRIGGER_SECRET }}
          COMMENT_USER_LOGIN: ${{ github.event.comment.user.login }}
          DIRECTOR_ORIGIN_SECRET: ${{ (github.event.comment.user.login == 'fluentwithkyle') && secrets.DIRECTOR_ORIGIN_SECRET || '' }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
          EXECUTION_DESCRIPTOR_FILE: execution-descriptor.json
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$CALLBACK_BASE_URL" ]; then
            echo "::error::RENDER_CALLBACK_BASE_URL is not configured; cannot validate activation through canonical ingress"
            exit 1
          fi

          # Build the activation payload with jq so multiline/control characters in
          # the GitHub comment are JSON-escaped before canonical validation.
          # The canonical ingress derives effective capabilities and permitted_paths
          # from the server-side activation-policy authority, not from comment text.
          # When the comment author matches the explicit trusted Director identity
          # (github.event.comment.user.login == 'fluentwithkyle') and the embedded
          # ACP descriptor declares a consequential task_mode (FAILOVER_EXECUTE), the
          # Director origin secret is passed so the canonical ingress treats the
          # activation as Director-admitted.
          ACTIVATION_JSON=$(jq -n \
            --arg comment_id "$COMMENT_ID" \
            --arg comment_body "$COMMENT_BODY" \
            --arg repository "$REPOSITORY" \
            --arg base_branch "$BASE_BRANCH" \
            '{
              comment_id: $comment_id,
              comment_body: $comment_body,
              repository: $repository,
              base_branch: $base_branch
            }')

          node poc/validate-external-activation.js gemini-issue-comment "$ACTIVATION_JSON"

          echo "activation_validated=true" >> "$GITHUB_OUTPUT"

      - name: Validate external activation through canonical ingress (workflow_dispatch)
        id: validate_activation_wfd
        if: github.event_name == 'workflow_dispatch'
        env:
          CALLBACK_BASE_URL: ${{ secrets.RENDER_CALLBACK_BASE_URL }}
          ACP_POC_TRIGGER_SECRET: ${{ secrets.ACP_POC_TRIGGER_SECRET }}
          DIRECTOR_ORIGIN_SECRET: ${{ (inputs.task_mode == 'FAILOVER_EXECUTE' && inputs.approval_id == '' && (github.actor == 'fluentwithkyle' || github.event.pull_request.user.login == 'fluentwithkyle')) && secrets.DIRECTOR_ORIGIN_SECRET || '' }}
          REQUEST_ID: ${{ inputs.request_id }}
          TASK: ${{ inputs.task }}
          TASK_NAME: ${{ inputs.task_name || '' }}
          REPOSITORY: ${{ inputs.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
          TASK_MODE: ${{ inputs.task_mode || 'REVIEW' }}
          CAPABILITIES: ${{ inputs.capabilities || 'read_only' }}
          PERMITTED_PATHS: ${{ inputs.permitted_paths || 'poc/' }}
          APPROVAL_ID: ${{ inputs.approval_id || '' }}
          VERIFICATION: ${{ inputs.verification || '' }}
          EXECUTION_DESCRIPTOR_FILE: execution-descriptor.json
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$CALLBACK_BASE_URL" ]; then
            echo "::error::RENDER_CALLBACK_BASE_URL is not configured; cannot validate activation through canonical ingress"
            exit 1
          fi

          ACTIVATION_JSON=$(jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg task "$TASK" \
            --arg task_name "$TASK_NAME" \
            --arg repository "$REPOSITORY" \
            --arg base_branch "$BASE_BRANCH" \
            --arg task_mode "$TASK_MODE" \
            --arg capabilities "$CAPABILITIES" \
            --arg permitted_paths "$PERMITTED_PATHS" \
            --arg approval_id "$APPROVAL_ID" \
            --arg verification "$VERIFICATION" \
            '{
              request_id: $request_id,
              task: $task,
              task_name: (if $task_name == "" then null else $task_name end),
              repository: $repository,
              base_branch: $base_branch,
              task_mode: $task_mode,
              capabilities: $capabilities,
              permitted_paths: $permitted_paths,
              approval_id: $approval_id,
              verification: $verification
            }')

          node poc/validate-external-activation.js gemini-workflow-dispatch "$ACTIVATION_JSON"

          echo "activation_validated=true" >> "$GITHUB_OUTPUT"

      - name: Prepare orchestration context (workflow_dispatch)
        id: orchestration_context_wfd
        if: github.event_name == 'workflow_dispatch' && steps.validate_activation_wfd.outputs.activation_validated == 'true' && !steps.validate_activation_wfd.outputs.replay
        shell: bash
        run: |
          set -euo pipefail

          # The orchestration context now consumes the SERVER-DERIVED execution descriptor
          # returned by the canonical activation ingress, not workflow input values.
          # The descriptor contains authoritative request_id, task_mode, capabilities,
          # permitted_paths, task, repository, and base_branch.
          DESCRIPTOR_FILE="execution-descriptor.json"
          if [ ! -f "$DESCRIPTOR_FILE" ]; then
            echo "::error::Execution descriptor file not found; server validation may have produced a replay"
            exit 1
          fi

          {
            echo 'request_id<<EOF'
            jq -r '.request_id' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'task_name<<EOF'
            jq -r '.task_name // ""' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'task<<EOF'
            jq -r '.task' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'repository<<EOF'
            jq -r '.repository' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'base_branch<<EOF'
            jq -r '.base_branch' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'kilo_execution_id<<EOF'
            printf '%s\n' ""
            echo 'EOF'
            echo 'builder_execution_id<<EOF'
            printf '%s\n' ""
            echo 'EOF'
            echo 'verification<<EOF'
            jq -r '.verification' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'task_mode<<EOF'
            jq -r '.task_mode' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'capabilities<<EOF'
            jq -r '.capabilities | join(",")' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'permitted_paths<<EOF'
            jq -r '.permitted_paths | join(" ")' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'execution_claim_id<<EOF'
            jq -r '.execution_claim_id // ""' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'carrier_identity<<EOF'
            printf '%s\n' "${{ steps.validate_activation_wfd.outputs.carrier_identity }}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare orchestration context (issue_comment)
        id: orchestration_context_ic
        if: github.event_name == 'issue_comment' && steps.validate_activation.outputs.activation_validated == 'true' && !steps.validate_activation.outputs.replay
        shell: bash
        run: |
          set -euo pipefail

          # The orchestration context now consumes the SERVER-DERIVED execution descriptor
          # returned by the canonical activation ingress, not workflow input values.
          DESCRIPTOR_FILE="execution-descriptor.json"
          if [ ! -f "$DESCRIPTOR_FILE" ]; then
            echo "::error::Execution descriptor file not found; server validation may have produced a replay"
            exit 1
          fi

          {
            echo 'request_id<<EOF'
            jq -r '.request_id' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'task_name<<EOF'
            jq -r '.task_name // ""' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'task<<EOF'
            jq -r '.task' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'repository<<EOF'
            jq -r '.repository' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'base_branch<<EOF'
            jq -r '.base_branch' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'kilo_execution_id<<EOF'
            printf '%s\n' ""
            echo 'EOF'
            echo 'builder_execution_id<<EOF'
            printf '%s\n' ""
            echo 'EOF'
            echo 'verification<<EOF'
            jq -r '.verification' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'task_mode<<EOF'
            jq -r '.task_mode' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'capabilities<<EOF'
            jq -r '.capabilities | join(",")' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'permitted_paths<<EOF'
            jq -r '.permitted_paths | join(" ")' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'execution_claim_id<<EOF'
            jq -r '.execution_claim_id // ""' "$DESCRIPTOR_FILE"
            echo 'EOF'
            echo 'carrier_identity<<EOF'
            printf '%s\n' "${{ steps.validate_activation.outputs.carrier_identity }}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Gemini in advisory mode
        id: gemini_run
        if: (steps.validate_activation.outputs.activation_validated == 'true' && !steps.validate_activation.outputs.replay) || (steps.validate_activation_wfd.outputs.activation_validated == 'true' && !steps.validate_activation_wfd.outputs.replay)
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          ORCHESTRATION_REQUEST_ID: ${{ steps.orchestration_context_wfd.outputs.request_id || steps.orchestration_context_ic.outputs.request_id }}
          ORCHESTRATION_TASK_NAME: ${{ steps.orchestration_context_wfd.outputs.task_name || steps.orchestration_context_ic.outputs.task_name }}
          ORCHESTRATION_TASK: ${{ steps.orchestration_context_wfd.outputs.task || steps.orchestration_context_ic.outputs.task }}
          ORCHESTRATION_REPOSITORY: ${{ steps.orchestration_context_wfd.outputs.repository || steps.orchestration_context_ic.outputs.repository }}
          ORCHESTRATION_BASE_BRANCH: ${{ steps.orchestration_context_wfd.outputs.base_branch || steps.orchestration_context_ic.outputs.base_branch }}
          ORCHESTRATION_KILO_EXECUTION_ID: ${{ steps.orchestration_context_wfd.outputs.kilo_execution_id || steps.orchestration_context_ic.outputs.kilo_execution_id }}
          ORCHESTRATION_BUILDER_EXECUTION_ID: ${{ steps.orchestration_context_wfd.outputs.builder_execution_id || steps.orchestration_context_ic.outputs.builder_execution_id }}
          ORCHESTRATION_VERIFICATION: ${{ steps.orchestration_context_wfd.outputs.verification || steps.orchestration_context_ic.outputs.verification }}
          ORCHESTRATION_TASK_MODE: ${{ steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode }}
          ORCHESTRATION_CAPABILITIES: ${{ steps.orchestration_context_wfd.outputs.capabilities || steps.orchestration_context_ic.outputs.capabilities }}
          ORCHESTRATION_PERMITTED_PATHS: ${{ steps.orchestration_context_wfd.outputs.permitted_paths || steps.orchestration_context_ic.outputs.permitted_paths }}
          ORCHESTRATION_EXECUTION_CLAIM_ID: ${{ steps.orchestration_context_wfd.outputs.execution_claim_id || steps.orchestration_context_ic.outputs.execution_claim_id }}
          ORCHESTRATION_CARRIER_IDENTITY: ${{ steps.orchestration_context_wfd.outputs.carrier_identity || steps.orchestration_context_ic.outputs.carrier_identity }}
          DEEPSEEK_COORDINATOR_SECRET: ${{ secrets.DEEPSEEK_COORDINATOR_SECRET }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          github_issue_number: ${{ github.event.issue.number }}
          github_pr_number: ${{ github.event.pull_request.number }}
          prompt: |
            You are Gemini, the Fluent with Kyle OpenClaw project's
            Architect, Reviewer, and Research agent.

            OPERATING MODE: ${{ steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || 'REVIEW' }}

            ${{ (steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || 'REVIEW') == 'REVIEW' && 'MODE: REVIEW (READ-ONLY ADVISORY). You may inspect and analyze the repository but MUST NOT modify any files, commit, push, or otherwise change repository state. Your role is advisory: provide analysis, risk assessment, implementation plans, and acceptance criteria.' || ((steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || 'REVIEW') == 'VERIFY_RECONCILE' && format('MODE: VERIFY_RECONCILE (BOUNDED RECONCILIATION). You are authorized to inspect verification of Kilo execution, update ONLY the following documentation files: {0}, and commit + push changes to those specific files. You MUST NOT modify any source code, production code, or files outside the permitted_paths list. Authorized capabilities: {1}. You MUST validate all changes against the verification requirements before committing.', steps.orchestration_context_wfd.outputs.permitted_paths || steps.orchestration_context_ic.outputs.permitted_paths, steps.orchestration_context_wfd.outputs.capabilities || steps.orchestration_context_ic.outputs.capabilities) || ((steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || 'REVIEW') == 'RESEARCH_DOCUMENT' && format('MODE: RESEARCH_DOCUMENT (RESEARCH + DURABLE PERSISTENCE). Inspect the architecture and relevant files to analyze problems or gather information, and persist findings to the durable research/documentation surface. Authorized paths: {0}. Authorized capabilities: {1}. Research documentation is an intrinsic completion requirement: you MUST persist the research record, research index entry, and TASK_LOG reference (committed and pushed) before completion. You MUST NOT modify source code, production code, or files outside permitted_paths. run_tests is not an authorized RESEARCH_DOCUMENT capability.', steps.orchestration_context_wfd.outputs.permitted_paths || steps.orchestration_context_ic.outputs.permitted_paths, steps.orchestration_context_wfd.outputs.capabilities || steps.orchestration_context_ic.outputs.capabilities) || format('MODE: FAILOVER_EXECUTE (FULL EXECUTION). You are authorized to implement, test, commit, and push within the permitted_paths scope. Authorized capabilities: {0}. Use git tools (commit, push) as needed but stay within scope.', steps.orchestration_context_wfd.outputs.capabilities || steps.orchestration_context_ic.outputs.capabilities))) }}

            If operating in REVIEW mode, your response is advisory only — no repository mutations.
            If operating in VERIFY_RECONCILE mode, you may only touch files in permitted_paths (docs/ai/*), commit, and push.
            If operating in FAILOVER_EXECUTE mode, you may implement and push within permitted_paths.

            ORCHESTRATION CONTEXT:
            - request_id: ${{ steps.orchestration_context_wfd.outputs.request_id || steps.orchestration_context_ic.outputs.request_id || 'manual' }}
            - task_name: ${{ steps.orchestration_context_wfd.outputs.task_name || steps.orchestration_context_ic.outputs.task_name || 'undefined' }}
            - repository: ${{ steps.orchestration_context_wfd.outputs.repository || steps.orchestration_context_ic.outputs.repository || github.repository }}
            - base_branch: ${{ steps.orchestration_context_wfd.outputs.base_branch || steps.orchestration_context_ic.outputs.base_branch || github.ref_name }}
            - task: ${{ steps.orchestration_context_wfd.outputs.task || steps.orchestration_context_ic.outputs.task || steps.request_comment.outputs.request || 'Provide an architecture/status assessment of the current repository.' }}
            - kilo_execution_id: ${{ steps.orchestration_context_wfd.outputs.kilo_execution_id || steps.orchestration_context_ic.outputs.kilo_execution_id || '' }}
            - verification_requirements: ${{ steps.orchestration_context_wfd.outputs.verification || steps.orchestration_context_ic.outputs.verification || 'Not specified' }}
            - task_mode: ${{ steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || 'REVIEW' }}
            - capabilities: ${{ steps.orchestration_context_wfd.outputs.capabilities || steps.orchestration_context_ic.outputs.capabilities || 'read_only' }}
            - permitted_paths: ${{ steps.orchestration_context_wfd.outputs.permitted_paths || steps.orchestration_context_ic.outputs.permitted_paths || '(none)' }}

            ${{ steps.orchestration_context_wfd.outputs.request_id || steps.orchestration_context_ic.outputs.request_id != '' && 'This task was dispatched from the Kilo orchestration layer. The request_id correlates this Gemini execution with the originating Kilo completion.' || 'The request below was explicitly submitted by a trusted repository collaborator through the @gemini-cli interface. Treat that request as the actual task.' }}

            --- TASK START ---
            ${{ steps.orchestration_context_wfd.outputs.task || steps.orchestration_context_ic.outputs.task || steps.request_comment.outputs.request || 'Provide an architecture/status assessment of the current repository.' }}
            --- TASK END ---

            VERIFICATION REQUIREMENTS (from original ACP task):
            ${{ steps.orchestration_context_wfd.outputs.verification || steps.orchestration_context_ic.outputs.verification || 'No specific verification requirements provided. Evaluate based on standard architectural review criteria.' }}

            IMPORTANT: When reviewing Kilo's work, you MUST explicitly evaluate against the VERIFICATION REQUIREMENTS listed above. Your review must address each requirement and state whether it is satisfied, partially satisfied, or not satisfied. If verification requirements are not met, clearly identify what is missing.

            Read ARCHITECTURE.md and GEMINI.md before responding.
            Distinguish observations from recommendations.
            Return a concrete, actionable response for the project.

      - name: 'Commit and push Gemini changes (mode-aware: RESEARCH_DOCUMENT, VERIFY_RECONCILE, FAILOVER_EXECUTE)'
        id: commit_push
        if: always() && (steps.gemini_run.outcome == 'success' || steps.gemini_run.outcome == '') && ((steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || 'REVIEW') == 'RESEARCH_DOCUMENT' || (steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || 'REVIEW') == 'VERIFY_RECONCILE' || (steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || 'REVIEW') == 'FAILOVER_EXECUTE')
        shell: bash
        env:
          TASK_MODE: ${{ steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || 'REVIEW' }}
          PERMITTED_PATHS: ${{ steps.orchestration_context_wfd.outputs.permitted_paths || steps.orchestration_context_ic.outputs.permitted_paths || 'poc/' }}
          BASE_BRANCH: ${{ steps.orchestration_context_wfd.outputs.base_branch || steps.orchestration_context_ic.outputs.base_branch || github.ref_name }}
          REQUEST_ID: ${{ steps.orchestration_context_wfd.outputs.request_id || steps.orchestration_context_ic.outputs.request_id || 'manual' }}
          TASK_NAME: ${{ steps.orchestration_context_wfd.outputs.task_name || steps.orchestration_context_ic.outputs.task_name || '' }}
          TASK_JSON: ${{ steps.orchestration_context_wfd.outputs.task || steps.orchestration_context_ic.outputs.task || '' }}
        run: |
          set -euo pipefail

          git config user.name "Gemini"
          git config user.email "gemini@users.noreply.github.com"
          git config --global --add safe.directory '*'

          COMMIT_SHA="null"
          PUSH_STATUS="false"
          HAS_CHANGES="false"
          UNCOMMITTED_CHANGES="false"
          PUSH_VERIFIED="false"
          COMMIT_MESSAGE=""

          case "$TASK_MODE" in
            RESEARCH_DOCUMENT)
              COMMIT_MESSAGE="RESEARCH_DOCUMENT: Persist research findings and documentation (request_id: $REQUEST_ID)"
              ;;
            VERIFY_RECONCILE)
              COMMIT_MESSAGE="VERIFY_RECONCILE: Persist verification reconciliation artifacts (request_id: $REQUEST_ID)"
              ;;
            FAILOVER_EXECUTE)
              COMMIT_MESSAGE="FAILOVER_EXECUTE: Persist authorized implementation changes (request_id: $REQUEST_ID)"
              ;;
            *)
              echo "::error::Unsupported task mode for commit/push: $TASK_MODE"
              exit 1
              ;;
          esac

          # Stage only files under PERMITTED_PATHS (space-separated, e.g. "poc/")
          # to avoid capturing unrelated worktree changes.
          STAGING_ERRORS=""
          for dir in $PERMITTED_PATHS; do
            if ! git add "$dir" 2>/dev/null; then
              STAGING_ERRORS="${STAGING_ERRORS}${dir}\n"
            fi
          done

          # Fail-closed: a staging failure for any permitted path must not be
          # silently ignored. The entire permitted set must stage successfully.
          if [ -n "$STAGING_ERRORS" ]; then
            echo "::error::Staging failed for one or more permitted_paths in $TASK_MODE mode:"
            echo -e "$STAGING_ERRORS"
            echo "UNCOMMITTED_CHANGES=true" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
            echo "push_status=$PUSH_STATUS" >> "$GITHUB_OUTPUT"
            echo "uncommitted_changes=$UNCOMMITTED_CHANGES" >> "$GITHUB_OUTPUT"
            echo "push_verified=$PUSH_VERIFIED" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Fail-closed: verify no out-of-scope changes are staged
          STAGED_FILES=$(git diff --cached --name-only)
          if [ -n "$STAGED_FILES" ]; then
            OUT_OF_SCOPE=""
            while IFS= read -r f; do
              if [ -n "$f" ]; then
                IN_SCOPE="false"
                for dir in $PERMITTED_PATHS; do
                  case "$f" in
                    "$dir"*) IN_SCOPE="true" ;;
                  esac
                done
                if [ "$IN_SCOPE" = "false" ]; then
                  OUT_OF_SCOPE="${OUT_OF_SCOPE}${f}\n"
                fi
              fi
            done <<< "$STAGED_FILES"
            if [ -n "$OUT_OF_SCOPE" ]; then
              echo "::error::Out-of-scope changes detected in permitted_paths staging for $TASK_MODE mode:"
              echo -e "$OUT_OF_SCOPE"
              UNCOMMITTED_CHANGES="true"
              echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
              echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
              echo "push_status=$PUSH_STATUS" >> "$GITHUB_OUTPUT"
              echo "uncommitted_changes=$UNCOMMITTED_CHANGES" >> "$GITHUB_OUTPUT"
              echo "push_verified=$PUSH_VERIFIED" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

          CHANGED_FILES=$(git diff --cached --name-only)
          if [ -n "$CHANGED_FILES" ]; then
            HAS_CHANGES="true"
            if [ "$TASK_MODE" = "RESEARCH_DOCUMENT" ]; then
              if [ -z "$TASK_NAME" ] && [ -n "$TASK_JSON" ]; then
                TASK_NAME=$(echo "$TASK_JSON" | jq -r '.task_name // empty' 2>/dev/null || echo '')
              fi
              if [ -n "$TASK_NAME" ]; then
                RESEARCH_RECORD_FILE="docs/ai/research/research-${TASK_NAME}.md"
                if [ ! -f "$RESEARCH_RECORD_FILE" ]; then
                  echo "::error::RESEARCH_DOCUMENT task $TASK_NAME requires durable research record $RESEARCH_RECORD_FILE before commit"
                  UNCOMMITTED_CHANGES="true"
                  echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
                  echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
                  echo "push_status=$PUSH_STATUS" >> "$GITHUB_OUTPUT"
                  echo "uncommitted_changes=$UNCOMMITTED_CHANGES" >> "$GITHUB_OUTPUT"
                  echo "push_verified=$PUSH_VERIFIED" >> "$GITHUB_OUTPUT"
                  exit 1
                fi
              else
                # Fail-closed: task_name missing for RESEARCH_DOCUMENT activation commit
                echo "::error::RESEARCH_DOCUMENT task requires task_name for durable research record verification; cannot commit without task identity"
                UNCOMMITTED_CHANGES="true"
                echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
                echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
                echo "push_status=$PUSH_STATUS" >> "$GITHUB_OUTPUT"
                echo "uncommitted_changes=$UNCOMMITTED_CHANGES" >> "$GITHUB_OUTPUT"
                echo "push_verified=$PUSH_VERIFIED" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi

            git commit -m "$COMMIT_MESSAGE" || {
              echo "::error::$TASK_MODE commit failed"
              COMMIT_SHA="null"
              PUSH_STATUS="false"
              UNCOMMITTED_CHANGES="true"
              echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
              echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
              echo "push_status=$PUSH_STATUS" >> "$GITHUB_OUTPUT"
              echo "uncommitted_changes=$UNCOMMITTED_CHANGES" >> "$GITHUB_OUTPUT"
              exit 1
            }
            COMMIT_SHA=$(git rev-parse HEAD)
            echo "Committed: $COMMIT_SHA"
            echo "$CHANGED_FILES"

            # Push to the authorized base branch
            git push "origin" "$BASE_BRANCH" || {
              echo "::error::$TASK_MODE push to origin/$BASE_BRANCH failed"
              PUSH_STATUS="false"
              UNCOMMITTED_CHANGES="true"
              echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
              echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
              echo "push_status=$PUSH_STATUS" >> "$GITHUB_OUTPUT"
              echo "uncommitted_changes=$UNCOMMITTED_CHANGES" >> "$GITHUB_OUTPUT"
              exit 1
            }
            PUSH_STATUS="true"
            echo "Pushed to origin/$BASE_BRANCH"

            # Verify the commit is present on the remote base branch
            REMOTE_HEAD=$(git ls-remote "origin" "$BASE_BRANCH" | awk '{print $1}')
            if [ -n "$REMOTE_HEAD" ] && [ "$COMMIT_SHA" = "$REMOTE_HEAD" ]; then
              PUSH_VERIFIED="true"
              echo "Verified commit on remote: $COMMIT_SHA"
            else
              echo "::error::$TASK_MODE push verification failed: remote HEAD ($REMOTE_HEAD) != local HEAD ($COMMIT_SHA)"
              PUSH_STATUS="false"
              UNCOMMITTED_CHANGES="true"
              echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
              echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
              echo "push_status=$PUSH_STATUS" >> "$GITHUB_OUTPUT"
              echo "uncommitted_changes=$UNCOMMITTED_CHANGES" >> "$GITHUB_OUTPUT"
              echo "push_verified=$PUSH_VERIFIED" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            echo "::error::$TASK_MODE mode staged no changes within permitted_paths: $PERMITTED_PATHS"
            UNCOMMITTED_CHANGES="true"
            echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
            echo "push_status=$PUSH_STATUS" >> "$GITHUB_OUTPUT"
            echo "uncommitted_changes=$UNCOMMITTED_CHANGES" >> "$GITHUB_OUTPUT"
            echo "push_verified=$PUSH_VERIFIED" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "push_status=$PUSH_STATUS" >> "$GITHUB_OUTPUT"
          echo "uncommitted_changes=$UNCOMMITTED_CHANGES" >> "$GITHUB_OUTPUT"
          echo "push_verified=$PUSH_VERIFIED" >> "$GITHUB_OUTPUT"

      - name: Determine Gemini execution result
        id: gemini_result
        if: always()
        env:
          TASK_MODE_INPUT: ${{ steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || '' }}
        shell: bash
        run: |
          set -euo pipefail

          # Determine task mode from server-derived descriptor if available
          DESCRIPTOR_FILE="execution-descriptor.json"
          if [ -f "$DESCRIPTOR_FILE" ] && [ -n "$TASK_MODE_INPUT" ]; then
            TASK_MODE="$TASK_MODE_INPUT"
          else
            TASK_MODE="REVIEW"
          fi

          GEMINI_OUTCOME="${{ steps.gemini_run.outcome }}"

          # Determine Gemini execution status from the actual step outcome.
          # Distinguish: dispatch accepted -> Gemini CLI executed -> succeeded/failed.
          # A GitHub 204 from workflow_dispatch only confirmed dispatch acceptance.
          if [ "$GEMINI_OUTCOME" = "success" ]; then
            STATUS="success"
            VERIFICATION_STATUS="PASS"
            BLOCKER_MSG=""
          elif [ "$GEMINI_OUTCOME" = "failure" ]; then
            STATUS="failure"
            VERIFICATION_STATUS="FAIL"
            BLOCKER_MSG="Gemini CLI execution failed (step outcome: failure)"
          else
            # skipped, cancelled, or empty -- Gemini did not execute successfully
            STATUS="failure"
            VERIFICATION_STATUS="FAIL"
            BLOCKER_MSG="Gemini workflow did not execute successfully (step outcome: ${GEMINI_OUTCOME:-none})"
          fi

          # Mode-aware persistence enforcement: For RESEARCH_DOCUMENT, VERIFY_RECONCILE,
          # and FAILOVER_EXECUTE, Gemini CLI succeeded but changes must be committed,
          # pushed, and verified on the remote base branch. Fail closed if any
          # persistence step fails.
          PERSIST_COMMIT_SHA=""
          PERSIST_PUSH_VERIFIED=""
          COMMIT_PUSH_OUTCOME="${{ steps.commit_push.outcome || '' }}"
          if [ "$TASK_MODE" = "FAILOVER_EXECUTE" ] && [ "$GEMINI_OUTCOME" = "success" ]; then
            PERSIST_COMMIT_SHA="${{ steps.commit_push.outputs.commit_sha || '' }}"
            PERSIST_PUSH_VERIFIED="${{ steps.commit_push.outputs.push_verified }}"
          elif [ "$TASK_MODE" = "RESEARCH_DOCUMENT" ] && [ "$GEMINI_OUTCOME" = "success" ]; then
            PERSIST_COMMIT_SHA="${{ steps.commit_push.outputs.commit_sha || '' }}"
            PERSIST_PUSH_VERIFIED="${{ steps.commit_push.outputs.push_verified }}"
          elif [ "$TASK_MODE" = "VERIFY_RECONCILE" ] && [ "$GEMINI_OUTCOME" = "success" ]; then
            PERSIST_COMMIT_SHA="${{ steps.commit_push.outputs.commit_sha || '' }}"
            PERSIST_PUSH_VERIFIED="${{ steps.commit_push.outputs.push_verified }}"
          fi

          if [ -n "$PERSIST_COMMIT_SHA" ] && [ "$PERSIST_COMMIT_SHA" != "null" ]; then
            # Check for uncommitted/unpushed changes
            UNCOMMITTED_CHANGES="${{ steps.commit_push.outputs.uncommitted_changes }}"
            if [ "$UNCOMMITTED_CHANGES" = "true" ]; then
              STATUS="failure"
              VERIFICATION_STATUS="FAIL"
              if [ "$TASK_MODE" = "RESEARCH_DOCUMENT" ]; then
                BLOCKER_MSG="$TASK_MODE mode: research documentation could not be persisted; changes remain uncommitted in workspace"
              elif [ "$TASK_MODE" = "VERIFY_RECONCILE" ]; then
                BLOCKER_MSG="$TASK_MODE mode: reconciliation artifacts could not be persisted; changes remain uncommitted in workspace"
              else
                BLOCKER_MSG="$TASK_MODE mode: Gemini CLI succeeded but repository changes remain uncommitted/unpushed; task cannot report success with uncommitted changes"
              fi
            elif [ "$COMMIT_PUSH_OUTCOME" = "failure" ]; then
              STATUS="failure"
              VERIFICATION_STATUS="FAIL"
              BLOCKER_MSG="$TASK_MODE mode: commit/push step failed; changes could not be persisted"
            elif [ -z "$PERSIST_COMMIT_SHA" ] || [ "$PERSIST_COMMIT_SHA" = "null" ]; then
              STATUS="failure"
              VERIFICATION_STATUS="FAIL"
              BLOCKER_MSG="$TASK_MODE mode: Gemini CLI succeeded but no commit SHA was produced; changes may remain uncommitted in workspace"
            elif [ "$PERSIST_PUSH_VERIFIED" != "true" ]; then
              STATUS="failure"
              VERIFICATION_STATUS="FAIL"
              BLOCKER_MSG="$TASK_MODE mode: commit/push succeeded but remote verification failed; commit not confirmed on remote base branch"
            fi
          elif [ "$GEMINI_OUTCOME" = "success" ] && [ "$TASK_MODE" != "REVIEW" ]; then
            # Gemini CLI succeeded in a persistence-capable mode but no commit was
            # produced. Fail-closed: do not allow status=success without a verified
            # commit SHA.
            STATUS="failure"
            VERIFICATION_STATUS="FAIL"
            BLOCKER_MSG="$TASK_MODE mode: Gemini CLI succeeded but commit/push produced no commit SHA; persistence was not verified"
          fi

          # Determine reconciliation status using the same contract as
          # determineReconciliationStatus() in poc/schemas/acp-schema.js:
          # VERIFY_RECONCILE + verification PASS -> COMPLETED
          # VERIFY_RECONCILE + verification FAIL -> SKIPPED
          # Other modes -> SKIPPED
          if [ "$TASK_MODE" = "VERIFY_RECONCILE" ]; then
            if [ "$VERIFICATION_STATUS" = "PASS" ]; then
              RECON_STATUS="COMPLETED"
            else
              RECON_STATUS="SKIPPED"
            fi
          else
            RECON_STATUS="SKIPPED"
          fi

          echo "gemini_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "verification_status=$VERIFICATION_STATUS" >> "$GITHUB_OUTPUT"
          echo "blocker_message=$BLOCKER_MSG" >> "$GITHUB_OUTPUT"
          echo "recon_status=$RECON_STATUS" >> "$GITHUB_OUTPUT"

      - name: Prepare ACP report payload
        id: callback_payload
        if: always()
        env:
          GEMINI_SUMMARY: ${{ steps.gemini_run.outputs.summary }}
          EXECUTION_CLAIM_ID: ${{ steps.orchestration_context_wfd.outputs.execution_claim_id || steps.orchestration_context_ic.outputs.execution_claim_id }}
          CARRIER_IDENTITY: ${{ steps.orchestration_context_wfd.outputs.carrier_identity || steps.orchestration_context_ic.outputs.carrier_identity }}
          IS_REPLAY: ${{ steps.validate_activation.outputs.replay == 'true' || steps.validate_activation_wfd.outputs.replay == 'true' }}
          TASK_MODE_INPUT: ${{ steps.orchestration_context_wfd.outputs.task_mode || steps.orchestration_context_ic.outputs.task_mode || '' }}
        shell: bash
        run: |
          set -euo pipefail

          # Derive ACP envelope fields from the SERVER-DERIVED execution descriptor.
          # The descriptor was returned by the canonical activation ingress and
          # persisted by poc/validate-external-activation.js. The request_id,
          # task, repository, base_branch, task_mode, capabilities, and
          # permitted_paths must all come from the descriptor — not from
          # workflow inputs — to preserve server-derived authority.
          DESCRIPTOR_FILE="execution-descriptor.json"
          if [ "$IS_REPLAY" = "true" ] && [ ! -f "$DESCRIPTOR_FILE" ]; then
            echo "::warning::Replay without descriptor file; using fallback values"
            REQUEST_ID=""
            TASK_NAME=""
            TASK=""
            REPOSITORY="${{ github.repository }}"
            BASE_BRANCH="${{ github.ref_name }}"
            TASK_MODE="REVIEW"
          elif [ -f "$DESCRIPTOR_FILE" ]; then
            REQUEST_ID="$(jq -r '.request_id' "$DESCRIPTOR_FILE")"
            TASK_NAME="$(jq -r '.task_name // ""' "$DESCRIPTOR_FILE" 2>/dev/null || echo '')"
            TASK="$(jq -r '.task' "$DESCRIPTOR_FILE" 2>/dev/null || echo '')"
            REPOSITORY="$(jq -r '.repository' "$DESCRIPTOR_FILE" 2>/dev/null || echo '${{ github.repository }}')"
            BASE_BRANCH="$(jq -r '.base_branch' "$DESCRIPTOR_FILE" 2>/dev/null || echo '${{ github.ref_name }}')"
            TASK_MODE="$(jq -r '.task_mode' "$DESCRIPTOR_FILE" 2>/dev/null || echo "$TASK_MODE_INPUT")"
          elif [ -n "$TASK_MODE_INPUT" ]; then
            REQUEST_ID=""
            TASK_NAME=""
            TASK=""
            REPOSITORY="${{ github.repository }}"
            BASE_BRANCH="${{ github.ref_name }}"
            TASK_MODE="$TASK_MODE_INPUT"
          else
            echo "::error::Execution descriptor file not found for ACP report payload"
            exit 1
          fi

          CURRENT_HEAD_SHA="${{ steps.commit_push.outputs.commit_sha || steps.gemini_result.outputs.current_head_sha || github.sha }}"

          # Capture Gemini output (stdout from run-gemini-cli).
          # Transported via env: (GEMINI_SUMMARY) to avoid shell-interpolation
          # of uncontrolled/multiline Gemini content inside the Bash source.
          GEMINI_OUTPUT="$GEMINI_SUMMARY"

          # Use status determined from actual Gemini execution outcome.
          # Do NOT hardcode status=success: a green workflow does not
          # prove Gemini's semantic verification succeeded.
          STATUS="${{ steps.gemini_result.outputs.gemini_status }}"
          VERIFICATION_STATUS="${{ steps.gemini_result.outputs.verification_status }}"
          BLOCKER_MSG="${{ steps.gemini_result.outputs.blocker_message }}"
          RECON_STATUS="${{ steps.gemini_result.outputs.recon_status }}"
          PERSIST_COMMIT_SHA="${{ steps.commit_push.outputs.commit_sha || 'null' }}"
          PERSIST_PUSH="${{ steps.commit_push.outputs.push_status || 'false' }}"

          # Build changed_files list from git for persistence tracking.
          # Must produce exactly ONE valid JSON array. A failed diff or
          # missing HEAD~1 (initial commit, no prior parent) must NOT be
          # silently treated as a successful diff — fail closed with an
          # error blocker. The checkout step fetches depth: 2 so HEAD~1
          # is normally available; if it is still missing, report a blocker
          # rather than falsely listing all files as changed.
          CHANGED_FILES_JSON='[]'
          DIFF_STATUS=0
          DIFF_OUTPUT=""
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            DIFF_OUTPUT=$(git diff --name-only HEAD~1 HEAD 2>&1) || DIFF_STATUS=$?
          else
            DIFF_STATUS=1
            DIFF_OUTPUT="fatal: HEAD~1 does not exist (initial commit or insufficient checkout depth); cannot determine changed files"
          fi

          if [ "$DIFF_STATUS" -ne 0 ]; then
            echo "::error::changed_files diff failed (exit $DIFF_STATUS): $DIFF_OUTPUT"
            DIFF_BLOCKER_MSG="changed_files diff command failed (exit $DIFF_STATUS); cannot produce complete changed_files list"
          else
            RAW_CHANGED_FILES_JSON=$(printf '%s' "$DIFF_OUTPUT" | jq -R -s -c 'split("\n") | map(select(length > 0))' 2>/dev/null)
            CHANGED_FILES_TYPE=$(printf '%s' "$RAW_CHANGED_FILES_JSON" | jq -r 'type' 2>/dev/null || echo 'null')
            if [ "$CHANGED_FILES_TYPE" = "array" ]; then
              CHANGED_FILES_JSON="$RAW_CHANGED_FILES_JSON"
            else
              echo "::error::changed_files JSON validation failed: output is not a valid JSON array (got type: $CHANGED_FILES_TYPE)"
              DIFF_BLOCKER_MSG="changed_files diff produced invalid JSON; cannot report changed files"
            fi
          fi

          # Build blockers array from the actual execution result
          BLOCKERS_JSON='[]'
          if [ "$STATUS" = "failure" ]; then
            BLOCKERS_JSON=$(jq -n --arg msg "$BLOCKER_MSG" '[$msg]')
          fi

          # Merge any diff/JSON validation blockers into the blockers array
          if [ -n "${DIFF_BLOCKER_MSG:-}" ]; then
            BLOCKERS_JSON=$(echo "$BLOCKERS_JSON" | jq --arg msg "$DIFF_BLOCKER_MSG" '(. + [$msg])')
          fi

          # Build reconciliation fields based on determined status
          RECON_CHANGED_FILES="[]"
          if [ "$RECON_STATUS" = "COMPLETED" ]; then
            RECON_COMMIT_SHA="${GITHUB_SHA}"
          else
            RECON_COMMIT_SHA="null"
          fi

          # Build ACP execution report
          INVOCATION_ID="gemini-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RUN_ID="${GITHUB_RUN_ID}"

          # For RESEARCH_DOCUMENT tasks, verify the durable research record exists
          # AND belongs to the current task. The task_name is sourced from the
          # server-derived execution descriptor (canonical ACP task identifier).
          # Fail-closed: if the record is missing, malformed, or cannot be verified,
          # the report status is forced to "failure" with a machine-readable blocker.
          # Non-RESEARCH_DOCUMENT tasks get null (no research record required).
          DURABLE_RESEARCH_RECORD_PATH="null"
          if [ "$TASK_MODE" = "RESEARCH_DOCUMENT" ] && [ -n "$TASK_NAME" ]; then
            RESEARCH_RECORD_FILE="docs/ai/research/research-${TASK_NAME}.md"
            if [ -f "$RESEARCH_RECORD_FILE" ]; then
              # Verify the research record belongs to the current task by checking
              # that the task_name is referenced in the record header.
              if grep -q "$TASK_NAME" "$RESEARCH_RECORD_FILE" 2>/dev/null; then
                DURABLE_RESEARCH_RECORD_PATH="$RESEARCH_RECORD_FILE"
              else
                STATUS="failure"
                RESEARCH_BLOCKER="RESEARCH_DOCUMENT task $(printf '%s' "$TASK_NAME") but research record $RESEARCH_RECORD_FILE does not reference the task_name; record may belong to a different task"
                BLOCKERS_JSON=$(echo "$BLOCKERS_JSON" | jq --arg msg "$RESEARCH_BLOCKER" '. + [$msg]')
              fi
            else
              # Fail-closed: missing research record for RESEARCH_DOCUMENT task
              STATUS="failure"
              RESEARCH_BLOCKER="RESEARCH_DOCUMENT task requires durable research record $RESEARCH_RECORD_FILE but it does not exist; report cannot represent a successful completed research task"
              BLOCKERS_JSON=$(jq -n --arg msg "$RESEARCH_BLOCKER" '[$msg]')
            fi
          elif [ "$TASK_MODE" = "RESEARCH_DOCUMENT" ] && [ -z "$TASK_NAME" ]; then
            # Fail-closed: task_name missing from server-derived descriptor for RESEARCH_DOCUMENT task
            STATUS="failure"
            RESEARCH_BLOCKER="RESEARCH_DOCUMENT task is missing task_name in the server-derived execution descriptor; cannot verify durable research record path"
            BLOCKERS_JSON=$(jq -n --arg msg "$RESEARCH_BLOCKER" '[$msg]')
          fi

          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg agent "Gemini" \
            --arg status "$STATUS" \
            --arg task "$TASK" \
            --arg repository "$REPOSITORY" \
            --arg base_branch "$BASE_BRANCH" \
            --arg current_head_sha "$CURRENT_HEAD_SHA" \
            --arg gemini_output "$GEMINI_OUTPUT" \
            --arg invocation_id "$INVOCATION_ID" \
            --arg run_id "$RUN_ID" \
            --argjson blockers "$BLOCKERS_JSON" \
            --arg recon_status "$RECON_STATUS" \
            --argjson recon_changed_files "$RECON_CHANGED_FILES" \
            --arg recon_commit_sha "$RECON_COMMIT_SHA" \
            --arg execution_claim_id "$EXECUTION_CLAIM_ID" \
            --arg carrier_identity "$CARRIER_IDENTITY" \
            --arg task_mode "$TASK_MODE" \
            --arg task_name "$TASK_NAME" \
            --arg durable_research_record_path "$DURABLE_RESEARCH_RECORD_PATH" \
            --argjson changed_files "$CHANGED_FILES_JSON" \
            --arg failover_commit "$PERSIST_COMMIT_SHA" \
            --arg failover_push "$PERSIST_PUSH" \
            '{
              request_id: (if $request_id == "" then null else $request_id end),
              agent: $agent,
              status: $status,
              task: $task,
              task_name: (if $task_name == "" then null else $task_name end),
              task_mode: $task_mode,
              repository: $repository,
              base_branch: $base_branch,
              current_head_sha: $current_head_sha,
              changed_files: $changed_files,
              verification: ["advisory review completed"],
              result: { execution_metadata: { invocation_id: $invocation_id, run_id: $run_id, carrier_identity: (if $carrier_identity == "" then null else $carrier_identity end), execution_claim_id: (if $execution_claim_id == "" then null else $execution_claim_id end) }, gemini_output: $gemini_output },
              commit: (if $failover_commit == "null" then null else $failover_commit end),
              push: ($failover_push == "true"),
              blockers: $blockers,
              reconciliation: {
                status: $recon_status,
                changed_files: $recon_changed_files,
                commit_sha: (if $recon_commit_sha == "null" then null else $recon_commit_sha end)
              },
              durable_research_record_path: (if $durable_research_record_path == "null" then null else $durable_research_record_path end)
             }' > callback_payload.json

           if ! jq empty callback_payload.json 2>/dev/null; then
             echo "::error::generated callback_payload.json is not valid JSON; report generation failed"
             exit 1
           fi

           cp callback_payload.json gemini-acp-report.json

          cat callback_payload.json

          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Persist durable readable evidence projection
        if: always() && steps.callback_payload.outputs.request_id != ''
        env:
          REQUEST_ID: ${{ steps.callback_payload.outputs.request_id }}
          BASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "$REQUEST_ID" ]; then
            echo "::warning::REQUEST_ID is empty; skipping durable evidence projection"
            exit 0
          fi

          mkdir -p docs/ai/reports

          REPORT_PATH="docs/ai/reports/gemini-acp-report-${REQUEST_ID}.json"

          cp callback_payload.json "$REPORT_PATH"

          git config user.name "Gemini"
          git config user.email "gemini@users.noreply.github.com"
          git config --global --add safe.directory '*'

          git add "$REPORT_PATH"

          if git diff --cached --quiet "$REPORT_PATH"; then
            echo "No changes to stage for $REPORT_PATH"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "docs(evidence): persist durable Gemini ACP report projection for ${REQUEST_ID}" || {
            echo "::warning::Could not commit durable evidence projection (possibly already committed or up to date)"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          for i in 1 2 3; do
            git pull --rebase origin "${BASE_BRANCH}" && git push origin "${BASE_BRANCH}" && {
              echo "Pushed durable evidence projection: $COMMIT_SHA (attempt $i)"
              exit 0
            } || {
              echo "Push failed due to concurrent update, retrying ($i/3)..."
              git fetch origin "${BASE_BRANCH}"
              git rebase "origin/${BASE_BRANCH}" || {
                echo "::warning::Rebase failed during durable evidence push; evidence file remains created but not pushed"
                exit 0
              }
            }
          done

          echo "::warning::Durable evidence projection push did not succeed after 3 attempts"
          exit 0

      - name: Send callback to Render (workflow_dispatch only)
        id: send_callback
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          CALLBACK_URL: ${{ secrets.RENDER_GEMINI_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.GEMINI_CALLBACK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$CALLBACK_URL" ] || [ -z "$CALLBACK_SECRET" ]; then
            echo "::warning::Callback URL or secret not configured, skipping callback"
            echo "callback_sent=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-gemini-callback-secret: $CALLBACK_SECRET" \
            -d @callback_payload.json)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "Callback response: $HTTP_CODE"
          echo "Callback body: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "callback_sent=true" >> "$GITHUB_OUTPUT"
          else
            echo "callback_sent=false" >> "$GITHUB_OUTPUT"
            echo "::error::Callback failed with HTTP $HTTP_CODE: $BODY"
            exit 1
          fi

      - name: Upload Gemini result artifact
        id: upload_gemini_result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-acp-report
          path: gemini-acp-report.json
          retention-days: 7
          if-no-files-found: error

      - name: Report artifact filing status
        id: report_filing_status
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          UPLOAD_OUTCOME="${{ steps.upload_gemini_result.outcome }}"

          case "$UPLOAD_OUTCOME" in
            success)
              STATUS="SUCCESS"
              ;;
            failure)
              STATUS="FAILED"
              ;;
            *)
              STATUS="UNKNOWN"
              ;;
          esac

          # Durable location fields for deterministic artifact retrieval.
          # These are derived from GitHub-provided context values and the
          # native actions/upload-artifact@v4 output (artifact-id) — never
          # from secrets or tokens.
          ARTIFACT_NAME="gemini-acp-report"
          ARTIFACT_FILE="gemini-acp-report.json"
          WORKFLOW_RUN_ID="${GITHUB_RUN_ID}"
          WORKFLOW_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ARTIFACT_ID="${{ steps.upload_gemini_result.outputs.artifact-id }}"
          ARTIFACT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "## Gemini ACP Report Artifact Filing Status"
            echo ""
            echo "The \`gemini-acp-report\` artifact upload step outcome was: \`${UPLOAD_OUTCOME:-unavailable}\`"
            echo ""
            echo "### Durable Retrieval Location"
            echo ""
            echo "On successful artifact filing, the canonical durable source for Gemini's report is the \`gemini-acp-report\` GitHub Actions artifact (artifact ID: \`${ARTIFACT_ID:-unavailable}\`) produced by this workflow run. The artifact is listed under the workflow run at the run URL. Inspect \`gemini-acp-report.json\` within that artifact. The workflow conclusion or upload status alone is not the report."
            echo ""
            echo "**Retrieval-location fields:** \`filing_status\`, \`artifact_name\`, \`artifact_file\`, \`artifact_id\`, \`workflow_run_id\`, \`workflow_run_url\`, \`artifact_url\`."
            echo ""
            echo "**Note:** \`filing_status: SUCCESS\` alone is not a retrieval location and is not evidence that the report itself has been inspected."
            echo ""
            echo "On failed or indeterminate artifact filing (\`$STATUS\` is FAILED or UNKNOWN), the canonical artifact was not successfully produced. Do not treat the workflow conclusion, Job Summary, or any textual response as proof of filing."
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| filing_status | \`${STATUS}\` |"
            echo "| artifact_name | \`${ARTIFACT_NAME}\` |"
            echo "| artifact_file | \`${ARTIFACT_FILE}\` |"
            echo "| artifact_id | \`${ARTIFACT_ID:-unavailable}\` |"
            echo "| workflow_run_id | \`${WORKFLOW_RUN_ID}\` |"
            echo "| workflow_run_url | \`${WORKFLOW_RUN_URL}\` |"
            echo "| artifact_url | \`${ARTIFACT_URL}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "filing_status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_file=${ARTIFACT_FILE}" >> "$GITHUB_OUTPUT"
          echo "artifact_id=${ARTIFACT_ID:-}" >> "$GITHUB_OUTPUT"
          echo "workflow_run_id=${WORKFLOW_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "workflow_run_url=${WORKFLOW_RUN_URL}" >> "$GITHUB_OUTPUT"
          echo "artifact_url=${ARTIFACT_URL}" >> "$GITHUB_OUTPUT"
