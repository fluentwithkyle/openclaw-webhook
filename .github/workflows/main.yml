name: Gemini Assistant

on:
  workflow_dispatch:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  gemini:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          prompt: |
            You are the development AI for the Fluent with Kyle
            OpenClaw project.

            First, inspect the repository and understand its existing
            architecture before making any changes.

            Follow the project's existing architecture and conventions.

            Make careful, production-ready changes.

            When modifying code:
            - Preserve existing functionality.
            - Keep the architecture modular.
            - Avoid unnecessary changes.
            - Verify your work before finishing.
