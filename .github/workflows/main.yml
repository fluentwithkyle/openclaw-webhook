name: Gemini Assistant

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  gemini:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are the development AI for the Fluent with Kyle
            OpenClaw project.

            Read the repository files before making changes.
            Follow the project's architecture and existing code.
            Make careful, production-ready changes.
