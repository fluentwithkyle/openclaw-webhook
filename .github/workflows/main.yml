name: Gemini Architect and Reviewer

# This comment exists solely to force GitHub workflow re-registration (TASK-KILO-GITHUB-WORKFLOW-TRIGGER-REREGISTRATION-001)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Correlation request ID for Kilo->Gemini orchestration'
        required: true
        type: string
      task:
        description: 'Task description for Gemini execution'
        required: true
        type: string
      repository:
        description: 'Repository name (owner/repo)'
        required: true
        type: string
      base_branch:
        description: 'Base branch for the task'
        required: true
        type: string
      kilo_execution_id:
        description: 'Kilo execution identifier from completed Kilo run'
        required: true
        type: string
      verification:
        description: 'Original ACP task verification requirements for Gemini review'
        required: false
        type: string
      task_mode:
        description: 'Operating mode: REVIEW (read-only), VERIFY_RECONCILE (bounded commit/push), or FAILOVER_EXECUTE (full execution)'
        required: false
        type: string
        default: 'REVIEW'
      capabilities:
        description: 'Comma-separated authorized capabilities (e.g. read_only,modify_files,commit,push)'
        required: false
        type: string
        default: 'read_only'
      permitted_paths:
        description: 'Comma-separated authorized file paths for verification/reconciliation'
        required: false
        type: string

jobs:
  advisory:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '@gemini-cli') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Gemini request (issue_comment)
        id: request_comment
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          REQUEST="${COMMENT_BODY#@gemini-cli}"
          REQUEST="${REQUEST# }"

          {
            echo 'request<<EOF'
            printf '%s\n' "$REQUEST"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare orchestration context (workflow_dispatch)
        id: orchestration_context
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          {
            echo 'request_id<<EOF'
            printf '%s\n' "${{ github.event.inputs.request_id }}"
            echo 'EOF'
            echo 'task<<EOF'
            printf '%s\n' "${{ github.event.inputs.task }}"
            echo 'EOF'
            echo 'repository<<EOF'
            printf '%s\n' "${{ github.event.inputs.repository }}"
            echo 'EOF'
            echo 'base_branch<<EOF'
            printf '%s\n' "${{ github.event.inputs.base_branch }}"
            echo 'EOF'
            echo 'kilo_execution_id<<EOF'
            printf '%s\n' "${{ github.event.inputs.kilo_execution_id }}"
            echo 'EOF'
            echo 'verification<<EOF'
            printf '%s\n' "${{ github.event.inputs.verification }}"
            echo 'EOF'
            echo 'task_mode<<EOF'
            printf '%s\n' "${{ github.event.inputs.task_mode || 'REVIEW' }}"
            echo 'EOF'
            echo 'capabilities<<EOF'
            printf '%s\n' "${{ github.event.inputs.capabilities || 'read_only' }}"
            echo 'EOF'
            echo 'permitted_paths<<EOF'
            printf '%s\n' "${{ github.event.inputs.permitted_paths || '' }}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Gemini in advisory mode
        id: gemini_run
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          ORCHESTRATION_REQUEST_ID: ${{ steps.orchestration_context.outputs.request_id }}
          ORCHESTRATION_TASK: ${{ steps.orchestration_context.outputs.task }}
          ORCHESTRATION_REPOSITORY: ${{ steps.orchestration_context.outputs.repository }}
          ORCHESTRATION_BASE_BRANCH: ${{ steps.orchestration_context.outputs.base_branch }}
          ORCHESTRATION_KILO_EXECUTION_ID: ${{ steps.orchestration_context.outputs.kilo_execution_id }}
          ORCHESTRATION_VERIFICATION: ${{ steps.orchestration_context.outputs.verification }}
          ORCHESTRATION_TASK_MODE: ${{ steps.orchestration_context.outputs.task_mode }}
          ORCHESTRATION_CAPABILITIES: ${{ steps.orchestration_context.outputs.capabilities }}
          ORCHESTRATION_PERMITTED_PATHS: ${{ steps.orchestration_context.outputs.permitted_paths }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          github_issue_number: ${{ github.event.issue.number }}
          github_pr_number: ${{ github.event.pull_request.number }}
          prompt: |
            You are Gemini, the Fluent with Kyle OpenClaw project's
            Architect, Reviewer, and Research agent.

            OPERATING MODE: ${{ steps.orchestration_context.outputs.task_mode || 'REVIEW' }}

            ${{ (steps.orchestration_context.outputs.task_mode || 'REVIEW') == 'REVIEW' && 'MODE: REVIEW (READ-ONLY ADVISORY). You may inspect and analyze the repository but MUST NOT modify any files, commit, push, or otherwise change repository state. Your role is advisory: provide analysis, risk assessment, implementation plans, and acceptance criteria.' || ((steps.orchestration_context.outputs.task_mode || 'REVIEW') == 'VERIFY_RECONCILE' && format('MODE: VERIFY_RECONCILE (BOUNDED RECONCILIATION). You are authorized to inspect verification of Kilo execution, update ONLY the following documentation files: {0}, and commit + push changes to those specific files. You MUST NOT modify any source code, production code, or files outside the permitted_paths list. Authorized capabilities: {1}. You MUST validate all changes against the verification requirements before committing.', steps.orchestration_context.outputs.permitted_paths, steps.orchestration_context.outputs.capabilities) || format('MODE: FAILOVER_EXECUTE (FULL EXECUTION). You are authorized to implement, test, commit, and push within the permitted_paths scope. Authorized capabilities: {0}. Use git tools (commit, push) as needed but stay within scope.', steps.orchestration_context.outputs.capabilities)) }}

            If operating in REVIEW mode, your response is advisory only — no repository mutations.
            If operating in VERIFY_RECONCILE mode, you may only touch files in permitted_paths (docs/ai/*), commit, and push.
            If operating in FAILOVER_EXECUTE mode, you may implement and push within permitted_paths.

            ORCHESTRATION CONTEXT:
            - request_id: ${{ steps.orchestration_context.outputs.request_id || 'manual' }}
            - repository: ${{ steps.orchestration_context.outputs.repository || github.repository }}
            - base_branch: ${{ steps.orchestration_context.outputs.base_branch || github.ref_name }}
            - task: ${{ steps.orchestration_context.outputs.task || steps.request_comment.outputs.request || 'Provide an architecture/status assessment of the current repository.' }}
            - kilo_execution_id: ${{ steps.orchestration_context.outputs.kilo_execution_id || '' }}
            - verification_requirements: ${{ steps.orchestration_context.outputs.verification || 'Not specified' }}
            - task_mode: ${{ steps.orchestration_context.outputs.task_mode || 'REVIEW' }}
            - capabilities: ${{ steps.orchestration_context.outputs.capabilities || 'read_only' }}
            - permitted_paths: ${{ steps.orchestration_context.outputs.permitted_paths || '(none)' }}

            ${{ steps.orchestration_context.outputs.request_id != '' && 'This task was dispatched from the Kilo orchestration layer. The request_id correlates this Gemini execution with the originating Kilo completion.' || 'The request below was explicitly submitted by a trusted repository collaborator through the @gemini-cli interface. Treat that request as the actual task.' }}

            --- TASK START ---
            ${{ steps.orchestration_context.outputs.task || steps.request_comment.outputs.request || 'Provide an architecture/status assessment of the current repository.' }}
            --- TASK END ---

            VERIFICATION REQUIREMENTS (from original ACP task):
            ${{ steps.orchestration_context.outputs.verification || 'No specific verification requirements provided. Evaluate based on standard architectural review criteria.' }}

            IMPORTANT: When reviewing Kilo's work, you MUST explicitly evaluate against the VERIFICATION REQUIREMENTS listed above. Your review must address each requirement and state whether it is satisfied, partially satisfied, or not satisfied. If verification requirements are not met, clearly identify what is missing.

            Read ARCHITECTURE.md and GEMINI.md before responding.
            Distinguish observations from recommendations.
            Return a concrete, actionable response for the project.

      - name: Determine Gemini execution result
        id: gemini_result
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          GEMINI_OUTCOME="${{ steps.gemini_run.outcome }}"
          TASK_MODE="${{ steps.orchestration_context.outputs.task_mode || 'REVIEW' }}"

          # Determine Gemini execution status from the actual step outcome.
          # Distinguish: dispatch accepted -> Gemini CLI executed -> succeeded/failed.
          # A GitHub 204 from workflow_dispatch only confirmed dispatch acceptance.
          if [ "$GEMINI_OUTCOME" = "success" ]; then
            STATUS="success"
            VERIFICATION_STATUS="PASS"
            BLOCKER_MSG=""
          elif [ "$GEMINI_OUTCOME" = "failure" ]; then
            STATUS="failure"
            VERIFICATION_STATUS="FAIL"
            BLOCKER_MSG="Gemini CLI execution failed (step outcome: failure)"
          else
            # skipped, cancelled, or empty -- Gemini did not execute successfully
            STATUS="failure"
            VERIFICATION_STATUS="FAIL"
            BLOCKER_MSG="Gemini workflow did not execute successfully (step outcome: ${GEMINI_OUTCOME:-none})"
          fi

          # Determine reconciliation status using the same contract as
          # determineReconciliationStatus() in poc/schemas/acp-schema.js:
          # VERIFY_RECONCILE + verification PASS -> COMPLETED
          # VERIFY_RECONCILE + verification FAIL -> SKIPPED
          # Other modes -> SKIPPED
          if [ "$TASK_MODE" = "VERIFY_RECONCILE" ]; then
            if [ "$VERIFICATION_STATUS" = "PASS" ]; then
              RECON_STATUS="COMPLETED"
            else
              RECON_STATUS="SKIPPED"
            fi
          else
            RECON_STATUS="SKIPPED"
          fi

          echo "gemini_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "verification_status=$VERIFICATION_STATUS" >> "$GITHUB_OUTPUT"
          echo "blocker_message=$BLOCKER_MSG" >> "$GITHUB_OUTPUT"
          echo "recon_status=$RECON_STATUS" >> "$GITHUB_OUTPUT"

      - name: Prepare ACP report payload
        id: callback_payload
        if: always()
        env:
          GEMINI_SUMMARY: ${{ steps.gemini_run.outputs.summary }}
          REQUEST_TASK: ${{ steps.request_comment.outputs.request }}
        shell: bash
        run: |
          set -euo pipefail

          # Derive ACP envelope fields based on trigger path.
          # workflow_dispatch: all fields from orchestration_context.
          # issue_comment: request_id and kilo_execution_id are genuinely
          # unavailable; task, repository, and base_branch are derived from
          # the comment body and execution context.
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            REQUEST_ID=""
            TASK="$REQUEST_TASK"
            REPOSITORY="${{ github.repository }}"
            BASE_BRANCH="${{ github.ref_name }}"
          else
            REQUEST_ID="${{ steps.orchestration_context.outputs.request_id }}"
            TASK="${{ steps.orchestration_context.outputs.task }}"
            REPOSITORY="${{ steps.orchestration_context.outputs.repository }}"
            BASE_BRANCH="${{ steps.orchestration_context.outputs.base_branch }}"
          fi

          CURRENT_HEAD_SHA="${GITHUB_SHA}"

          # Capture Gemini output (stdout from run-gemini-cli).
          # Transported via env: (GEMINI_SUMMARY) to avoid shell-interpolation
          # of uncontrolled/multiline Gemini content inside the Bash source.
          GEMINI_OUTPUT="$GEMINI_SUMMARY"

          # Use status determined from actual Gemini execution outcome.
          # Do NOT hardcode status=success: a green workflow does not
          # prove Gemini's semantic verification succeeded.
          STATUS="${{ steps.gemini_result.outputs.gemini_status }}"
          VERIFICATION_STATUS="${{ steps.gemini_result.outputs.verification_status }}"
          BLOCKER_MSG="${{ steps.gemini_result.outputs.blocker_message }}"
          RECON_STATUS="${{ steps.gemini_result.outputs.recon_status }}"

          # Build blockers array from the actual execution result
          if [ "$STATUS" = "failure" ]; then
            BLOCKERS=$(jq -n --arg msg "$BLOCKER_MSG" '[$msg]')
          else
            BLOCKERS="[]"
          fi

          # Build reconciliation fields based on determined status
          RECON_CHANGED_FILES="[]"
          if [ "$RECON_STATUS" = "COMPLETED" ]; then
            RECON_COMMIT_SHA="${GITHUB_SHA}"
          else
            RECON_COMMIT_SHA="null"
          fi

          # Build ACP execution report
          INVOCATION_ID="gemini-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RUN_ID="${GITHUB_RUN_ID}"

          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg agent "Gemini" \
            --arg status "$STATUS" \
            --arg task "$TASK" \
            --arg repository "$REPOSITORY" \
            --arg base_branch "$BASE_BRANCH" \
            --arg current_head_sha "$CURRENT_HEAD_SHA" \
            --arg gemini_output "$GEMINI_OUTPUT" \
            --arg invocation_id "$INVOCATION_ID" \
            --arg run_id "$RUN_ID" \
            --argjson blockers "$BLOCKERS" \
            --arg recon_status "$RECON_STATUS" \
            --argjson recon_changed_files "$RECON_CHANGED_FILES" \
            --arg recon_commit_sha "$RECON_COMMIT_SHA" \
            '{
              request_id: (if $request_id == "" then null else $request_id end),
              agent: $agent,
              status: $status,
              task: $task,
              repository: $repository,
              base_branch: $base_branch,
              current_head_sha: $current_head_sha,
              changed_files: [],
              verification: ["advisory review completed"],
              result: { execution_metadata: { invocation_id: $invocation_id, run_id: $run_id }, gemini_output: $gemini_output },
              commit: null,
              push: false,
              blockers: $blockers,
              reconciliation: {
                status: $recon_status,
                changed_files: $recon_changed_files,
                commit_sha: (if $recon_commit_sha == "null" then null else $recon_commit_sha end)
              }
            }' > callback_payload.json

          cp callback_payload.json gemini-acp-report.json

          cat callback_payload.json

      - name: Send callback to Render (workflow_dispatch only)
        id: send_callback
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          CALLBACK_URL: ${{ secrets.RENDER_GEMINI_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.GEMINI_CALLBACK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$CALLBACK_URL" ] || [ -z "$CALLBACK_SECRET" ]; then
            echo "::warning::Callback URL or secret not configured, skipping callback"
            echo "callback_sent=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-gemini-callback-secret: $CALLBACK_SECRET" \
            -d @callback_payload.json)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "Callback response: $HTTP_CODE"
          echo "Callback body: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "callback_sent=true" >> "$GITHUB_OUTPUT"
          else
            echo "callback_sent=false" >> "$GITHUB_OUTPUT"
            echo "::error::Callback failed with HTTP $HTTP_CODE: $BODY"
            exit 1
          fi

      - name: Upload Gemini result artifact
        id: upload_gemini_result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-acp-report
          path: gemini-acp-report.json
          retention-days: 7
          if-no-files-found: error

      - name: Report artifact filing status
        id: report_filing_status
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          UPLOAD_OUTCOME="${{ steps.upload_gemini_result.outcome }}"

          case "$UPLOAD_OUTCOME" in
            success)
              STATUS="SUCCESS"
              ;;
            failure)
              STATUS="FAILED"
              ;;
            *)
              STATUS="UNKNOWN"
              ;;
          esac

          {
            echo "## Gemini ACP Report Artifact Filing Status"
            echo ""
            echo "The \`gemini-acp-report\` artifact upload step outcome was: \`${UPLOAD_OUTCOME:-unavailable}\`"
            echo ""
            echo "filing_status: ${STATUS}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "filing_status=${STATUS}" >> "$GITHUB_OUTPUT"
