name: Gemini Architect and Failover Agent

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  advisory:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '@gemini-cli') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        !contains(github.event.comment.body, 'ACTIVATE TEMPORARY CODEX FAILOVER MODE')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Gemini request
        id: request
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          REQUEST="${COMMENT_BODY#@gemini-cli}"
          REQUEST="${REQUEST# }"

          {
            echo 'request<<EOF'
            printf '%s\n' "$REQUEST"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Gemini in advisory mode
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          github_issue_number: ${{ github.event.issue.number }}
          github_pr_number: ${{ github.event.pull_request.number }}
          prompt: |
            You are Gemini, the Fluent with Kyle OpenClaw project's
            Architect, Reviewer, and Research agent.

            MODE: NORMAL ADVISORY MODE

            In this mode you are advisory only.

            You may:
            - inspect the repository;
            - inspect ARCHITECTURE.md and GEMINI.md;
            - analyze architecture and implementation;
            - review code and integrations;
            - research repository state;
            - produce implementation plans;
            - identify affected files, risks, validation steps, and
              acceptance criteria.

            You must NOT:
            - modify repository files;
            - create, modify, rename, move, or delete files;
            - commit or push;
            - create or merge pull requests;
            - otherwise change repository state.

            The request below was explicitly submitted by a trusted
            repository collaborator through the @gemini-cli interface.

            Treat that request as the actual task.

            --- REQUEST START ---
            ${{ steps.request.outputs.request || 'Provide an architecture/status assessment of the current repository.' }}
            --- REQUEST END ---

            Read ARCHITECTURE.md and GEMINI.md before responding.
            Distinguish observations from recommendations.
            Return a concrete, actionable response for the project.

  failover:
    if: >-
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, '@gemini-cli') &&
      contains(github.event.comment.body, 'ACTIVATE TEMPORARY CODEX FAILOVER MODE') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Gemini failover request
        id: request
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          REQUEST="${COMMENT_BODY#@gemini-cli}"
          REQUEST="${REQUEST# }"

          {
            echo 'request<<EOF'
            printf '%s\n' "$REQUEST"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Gemini in temporary Codex failover mode
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          github_issue_number: ${{ github.event.issue.number }}
          github_pr_number: ${{ github.event.pull_request.number }}
          prompt: |
            You are Gemini, the Fluent with Kyle OpenClaw project's
            Architect, Reviewer, and Research agent.

            MODE: TEMPORARY CODEX FAILOVER MODE

            The repository workflow has independently verified that:
            1. this request came from a trusted repository collaborator; and
            2. the request explicitly contains:
               ACTIVATE TEMPORARY CODEX FAILOVER MODE

            This is an explicit emergency role substitution.

            Codex is currently unavailable.

            You are therefore temporarily assuming the repository
            implementation responsibilities normally assigned to Codex.

            This authority applies ONLY to this workflow run and task.
            It does not permanently change the project's architecture or
            your normal Gemini role.

            In this mode you may:
            - modify repository files;
            - implement approved changes;
            - run tests and validation;
            - debug implementation issues;
            - create commits;
            - push changes;
            - create pull requests;
            - perform implementation work required to continue the project.

            You retain your normal Architect and Reviewer responsibilities.

            Rules:
            1. Read ARCHITECTURE.md and GEMINI.md first.
            2. Preserve existing application behavior.
            3. Make the smallest verified changes necessary.
            4. Do not perform broad rewrites.
            5. Do not change business logic unless explicitly required.
            6. Do not expose or commit secrets.
            7. Clearly identify every file changed.
            8. Run focused tests and validation.
            9. Report exactly what was implemented.
            10. Report exactly what was verified.
            11. Report anything that remains blocked.
            12. Explicitly identify the work as performed under
                TEMPORARY CODEX FAILOVER MODE.

            IMPORTANT REPOSITORY PERSISTENCE RULE:
            You are operating inside the checked-out GitHub repository.
            If the requested task requires repository changes, you MUST
            actually modify the files in the workspace. Do not merely
            describe the changes or provide a proposed patch in your
            response. The workflow will verify and persist your changes
            after this step.

            The trusted collaborator's request is below.

            --- REQUEST START ---
            ${{ steps.request.outputs.request }}
            --- REQUEST END ---

            Execute the requested implementation task now.

      - name: Verify and persist failover changes
        shell: bash
        env:
          REQUEST: ${{ steps.request.outputs.request }}
        run: |
          set -euo pipefail

          # Authorized file scope for this failover task
          # Only ARCHITECTURE.md is authorized per the task specification
          AUTHORIZED_FILES="ARCHITECTURE.md"

          echo "=== COMMIT SCOPE GATE ==="
          echo "Authorized files: $AUTHORIZED_FILES"

          echo "Checking repository changes produced by Gemini..."
          git status --short

          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "ERROR: Gemini completed without producing any repository changes."
            echo "Failover implementation was not persisted."
            exit 1
          fi

          echo "Changes detected. Showing diff summary:"
          git diff --stat
          git status --short

          # Get all changed files (modified, added, deleted)
          CHANGED_FILES="$(git diff --name-only)"
          ADDED_FILES="$(git ls-files --others --exclude-standard)"
          DELETED_FILES="$(git diff --name-only --diff-filter=D)"
          ALL_CHANGED_FILES="$(printf '%s\n%s\n%s\n' "$CHANGED_FILES" "$ADDED_FILES" "$DELETED_FILES" | sort -u | sed '/^$/d')"

          echo "=== SCOPE CHECK ==="
          echo "All changed files:"
          printf '%s\n' "$ALL_CHANGED_FILES"

          # Check each changed file against authorized scope
          UNAUTHORIZED_FILES=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! printf '%s\n' "$AUTHORIZED_FILES" | grep -qxF "$file"; then
              UNAUTHORIZED_FILES="${UNAUTHORIZED_FILES}${file}\n"
            fi
          done <<< "$ALL_CHANGED_FILES"

          if [ -n "$UNAUTHORIZED_FILES" ]; then
            echo "==========================================="
            echo "COMMIT GATE FAILED: Unauthorized files changed"
            echo "==========================================="
            echo "The following files are NOT in the authorized scope:"
            printf '%s' "$UNAUTHORIZED_FILES"
            echo "Authorized scope: $AUTHORIZED_FILES"
            echo ""
            echo "STOPPING: No commit, no push."
            exit 1
          fi

          echo "Scope check PASSED: All changed files are authorized."

          # Stage only authorized files (no git add -A)
          for file in $AUTHORIZED_FILES; do
            if [ -f "$file" ] || git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              git add "$file"
            fi
          done

          # Also stage any authorized files that were deleted
          for file in $DELETED_FILES; do
            if printf '%s\n' "$AUTHORIZED_FILES" | grep -qxF "$file"; then
              git rm "$file" 2>/dev/null || true
            fi
          done

          if git diff --cached --quiet; then
            echo "ERROR: No staged changes remain after scope-gated staging."
            exit 1
          fi

          echo "=== FINAL DIFF REVIEW ==="
          git diff --cached --stat
          git diff --cached

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Gemini temporary Codex failover implementation"

          git push origin HEAD:${GITHUB_REF_NAME}

          echo "Verifying pushed repository state..."
          git fetch origin "${GITHUB_REF_NAME}"
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse "origin/${GITHUB_REF_NAME}")"

          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "ERROR: Push verification failed."
            echo "Local:  $LOCAL_SHA"
            echo "Remote: $REMOTE_SHA"
            exit 1
          fi

          echo "Failover changes successfully committed and pushed: $LOCAL_SHA"
